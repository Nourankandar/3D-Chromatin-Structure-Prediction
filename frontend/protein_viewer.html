<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChromoGen · Protein 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=Cairo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b2b26; --scene:#08201c; --fg:#daf1de; --muted:#8eb69b; --primary:#8eb69b;
    --border:rgba(218,241,222,.14); --card:rgba(11,43,38,.72); --card-solid:#1c433a;
    --font-display:"Space Grotesk","Cairo",sans-serif; --font-sans:"Inter","Cairo",sans-serif;
  }
  :root[data-theme="light"]{ --bg:#f2f9f3; --scene:#0a201d; --fg:#051f20; --muted:#3f6155; --primary:#163832; --border:rgba(5,31,32,.12); --card:rgba(255,255,255,.8); --card-solid:#ffffff; }

  /* ── أزرق ── */
  :root[data-accent="blue"]{
    --bg:#171b26; --scene:#11141d; --fg:#e7e9ee; --muted:#819ada; --primary:#819ada;
    --border:rgba(63,67,78,.16); --card:rgba(23,27,38,.72); --card-solid:#262c3b;
  }
  :root[data-theme="light"][data-accent="blue"]{
    --bg:#f6f7f8; --scene:#11141d; --fg:#15171e; --muted:#495c8d; --primary:#2b4482;
    --border:rgba(21,23,30,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── بنفسجي ── */
  :root[data-accent="purple"]{
    --bg:#1f1a24; --scene:#17131b; --fg:#ebe8ed; --muted:#b18dce; --primary:#b18dce;
    --border:rgba(71,66,76,.16); --card:rgba(31,26,36,.72); --card-solid:#312938;
  }
  :root[data-theme="light"][data-accent="purple"]{
    --bg:#f7f7f8; --scene:#17131b; --fg:#1a161d; --muted:#6e5582; --primary:#5a3875;
    --border:rgba(26,22,29,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── ليلكي ── */
  :root[data-accent="lilac"]{
    --bg:#201c21; --scene:#181519; --fg:#ebeaec; --muted:#b79ac1; --primary:#b79ac1;
    --border:rgba(72,68,73,.16); --card:rgba(32,28,33,.72); --card-solid:#322d34;
  }
  :root[data-theme="light"][data-accent="lilac"]{
    --bg:#f7f7f8; --scene:#181519; --fg:#1a181b; --muted:#706176; --primary:#5f4667;
    --border:rgba(26,24,27,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── زهري ── */
  :root[data-accent="rose"]{
    --bg:#24191b; --scene:#1c1214; --fg:#ede8e9; --muted:#d18996; --primary:#d18996;
    --border:rgba(76,65,67,.16); --card:rgba(36,25,27,.72); --card-solid:#39282b;
  }
  :root[data-theme="light"][data-accent="rose"]{
    --bg:#f8f7f7; --scene:#1c1214; --fg:#1d1617; --muted:#85525b; --primary:#793541;
    --border:rgba(29,22,23,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── خمري ── */
  :root[data-accent="wine"]{
    --bg:#281519; --scene:#1f0f12; --fg:#efe7e8; --muted:#e2788b; --primary:#e2788b;
    --border:rgba(80,61,65,.16); --card:rgba(40,21,25,.72); --card-solid:#3e2328;
  }
  :root[data-theme="light"][data-accent="wine"]{
    --bg:#f8f6f7; --scene:#1f0f12; --fg:#1f1416; --muted:#944251; --primary:#8b2335;
    --border:rgba(31,20,22,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── ذهبي ── */
  :root[data-accent="gold"]{
    --bg:#282215; --scene:#1f190f; --fg:#efece7; --muted:#e2be78; --primary:#e2be78;
    --border:rgba(80,74,61,.16); --card:rgba(40,34,21,.72); --card-solid:#3e3523;
  }
  :root[data-theme="light"][data-accent="gold"]{
    --bg:#f8f8f6; --scene:#1f190f; --fg:#1f1b14; --muted:#947842; --primary:#8b6723;
    --border:rgba(31,27,20,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── رمادي ── */
  :root[data-accent="slate"]{
    --bg:#1c2021; --scene:#151819; --fg:#eaebec; --muted:#9ab5c1; --primary:#9ab5c1;
    --border:rgba(68,72,73,.16); --card:rgba(28,32,33,.72); --card-solid:#2d3234;
  }
  :root[data-theme="light"][data-accent="slate"]{
    --bg:#f7f7f8; --scene:#151819; --fg:#181a1b; --muted:#616f76; --primary:#465d67;
    --border:rgba(24,26,27,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);overflow:hidden}
  #cv{position:absolute;inset:0}
  #cv canvas{display:block;width:100%!important;height:100%!important;cursor:grab}
  #cv canvas:active{cursor:grabbing}

  /* overlay التحميل */
  #loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--scene);gap:.9rem;z-index:5;transition:opacity .3s}
  #loading.hidden{opacity:0;pointer-events:none}
  .spin{width:34px;height:34px;border:2.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #load-msg{font-size:12px;color:var(--muted);font-family:var(--font-sans)}

  /* أدوات علوية */
  .toolbar{position:absolute;top:12px;inset-inline-start:12px;z-index:4;display:flex;gap:8px}
  .tbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;
    border:1px solid color-mix(in srgb, var(--fg) 22%, transparent);
    background:var(--card-solid);
    box-shadow:0 1px 4px rgba(0,0,0,.18);
    color:var(--fg);
    font-family:var(--font-sans);font-size:12px;cursor:pointer;transition:border-color .15s,background .15s}
  .tbtn:hover{border-color:color-mix(in oklch,var(--primary) 45%,transparent); background:color-mix(in srgb, var(--card-solid) 85%, var(--fg) 15%)}
  .tbtn.on{border-color:var(--primary);color:var(--primary); background:color-mix(in srgb, var(--primary) 18%, var(--card-solid))}

  /* بطاقة العنوان */
  .title-card{position:absolute;top:12px;inset-inline-end:12px;z-index:4;background:var(--card);backdrop-filter:blur(8px);
    border:1px solid var(--border);border-radius:12px;padding:.6rem .9rem;max-width:240px}
  .title-card .t{font-family:var(--font-display);font-weight:600;font-size:.9rem}
  .title-card .s{font-size:.72rem;color:var(--muted);margin-top:.15rem;font-family:var(--font-sans)}

  /* مفتاح ألوان الذرات */
  .legend{position:absolute;bottom:12px;inset-inline-start:12px;z-index:4;background:var(--card);backdrop-filter:blur(8px);
    border:1px solid var(--border);border-radius:12px;padding:.6rem .8rem;display:flex;gap:.9rem;flex-wrap:wrap;max-width:calc(100% - 24px)}
  .legend .it{display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:var(--muted);font-family:var(--font-sans)}
  .legend .sw{width:10px;height:10px;border-radius:50%}

  .err{color:#e5766f;font-size:12px;max-width:80%;text-align:center;line-height:1.6;font-family:var(--font-sans)}
</style>
</head>
<body>

<div id="cv"></div>

<div class="toolbar">
  <button class="tbtn on" id="btnRibbon" onclick="setMode('ribbon')">〰 شريط</button>
  <button class="tbtn" id="btnAtoms" onclick="setMode('atoms')">⦿ ذرات</button>
  <span style="width:1px;background:var(--border);margin:0 2px"></span>
  <button class="tbtn on" id="btnRot" onclick="toggleRot()">⟳ دوران</button>
  <button class="tbtn" onclick="resetView()">⊙ توسيط</button>
</div>

<div class="title-card" id="titleCard" style="display:none">
  <div class="t" id="tTitle">—</div>
  <div class="s" id="tSub">—</div>
</div>

<div class="legend" id="legend" style="display:none">
  <div class="it"><span class="sw" style="background:#aaaaaa"></span>C</div>
  <div class="it"><span class="sw" style="background:#4488ff"></span>N</div>
  <div class="it"><span class="sw" style="background:#ff4444"></span>O</div>
  <div class="it"><span class="sw" style="background:#ffdd44"></span>S</div>
  <div class="it"><span class="sw" style="background:#ff8800"></span>P</div>
</div>

<div id="loading">
  <div class="spin"></div>
  <p id="load-msg">جاري تحميل المحرك…</p>
</div>

<script>

(function(){ try{ var p=new URLSearchParams(location.search);
  var storedTheme = localStorage.getItem('chromogen-theme');
  var wantedTheme = p.get('theme') || storedTheme || 'dark';
  if(wantedTheme==='light') document.documentElement.setAttribute('data-theme','light');

  var storedAccent = p.get('accent') || localStorage.getItem('chromogen-accent');
  if(storedAccent && storedAccent!=='green') document.documentElement.setAttribute('data-accent', storedAccent);

  window.addEventListener('storage', function(e){
    if(e.key==='chromogen-theme'){
      document.documentElement.setAttribute('data-theme', e.newValue==='light' ? 'light' : 'dark');
      if(typeof refreshSceneColors === 'function') refreshSceneColors();
    }
    if(e.key==='chromogen-accent'){
      if(e.newValue && e.newValue!=='green') document.documentElement.setAttribute('data-accent', e.newValue);
      else document.documentElement.removeAttribute('data-accent');
      if(typeof refreshSceneColors === 'function') refreshSceneColors();
    }
});
}catch(e){} })();
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ── جداول الذرات  ──
const ATOM_COLORS = { C:0xaaaaaa, N:0x4488ff, O:0xff4444, S:0xffdd44, H:0xffffff, P:0xff8800, FE:0xff6600, ZN:0x8888ff, DEFAULT:0xcccccc };
const ATOM_RADII  = { C:1.0, N:0.95, O:0.9, S:1.2, H:0.6, P:1.15, FE:1.3, ZN:1.25, DEFAULT:0.9 };

let scene, camera, renderer, controls, proteinGroup=null, autoRot=true;

function sceneColor(){ return getComputedStyle(document.documentElement).getPropertyValue('--scene').trim() || '#08201c'; }
function refreshSceneColors(){
  if(!scene) return;
  const bg = new THREE.Color(sceneColor());
  scene.background = bg;
  if(scene.fog) scene.fog.color = bg;
}

function initThree(){
  const host = document.getElementById('cv');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(sceneColor());
  scene.fog = new THREE.FogExp2(scene.background.getHex(), .0016);

  camera = new THREE.PerspectiveCamera(50, host.clientWidth/host.clientHeight, 0.1, 4000);
  camera.position.set(0, 0, 120);

  renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(host.clientWidth, host.clientHeight);
  host.appendChild(renderer.domElement);

  // إضاءة
  scene.add(new THREE.AmbientLight(0xffffff, .55));
  const d1 = new THREE.DirectionalLight(0xffffff, 1.1); d1.position.set(2,3,2); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0x8eb69b, .7);  d2.position.set(-2,-1,3); scene.add(d2);
  const d3 = new THREE.DirectionalLight(0xffffff, .35); d3.position.set(0,0,-3); scene.add(d3);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = .08;
  controls.rotateSpeed = .8; controls.autoRotate = autoRot; controls.autoRotateSpeed = 1.1;

  window.addEventListener('resize', onResize);
  animate();
}

function onResize(){
  const host = document.getElementById('cv');
  camera.aspect = host.clientWidth/host.clientHeight; camera.updateProjectionMatrix();
  renderer.setSize(host.clientWidth, host.clientHeight);
}

function animate(){
  requestAnimationFrame(animate);
  controls.autoRotate = autoRot;
  controls.update();
  renderer.render(scene, camera);
}

function toggleRot(){ autoRot = !autoRot; document.getElementById('btnRot').classList.toggle('on', autoRot); }
function resetView(){ camera.position.set(0,0,120); controls.target.set(0,0,0); controls.update(); }

function parsePDB(text){
  const atoms=[]; const lines=text.split('\n');
  for(const line of lines){
    if(line.startsWith('ATOM')||line.startsWith('HETATM')){
      const element=(line.slice(76,78)||line.slice(12,14)).trim().toUpperCase();
      if(element==='H'||element==='D') continue;
      const x=parseFloat(line.slice(30,38)), y=parseFloat(line.slice(38,46)), z=parseFloat(line.slice(46,54));
      if(isNaN(x)||isNaN(y)||isNaN(z)) continue;
      atoms.push({
        x,y,z, element:element||'C',
        name:line.slice(12,16).trim(),
        chain:(line.slice(21,22).trim()||'A'),
        resSeq:parseInt(line.slice(22,26))||0
      });
    }
  }
  return atoms;
}

function disposeGroup(g){ g.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); }); }

const CHAIN_COLORS = [0x8eb69b, 0xe0b24d, 0x6ba3d6, 0xd98a6a, 0xb088d9, 0x5cbf9e, 0xd97aa5];
const TARGET_R = 42;
let currentAtoms = null, currentMode = 'ribbon';

function centerScale(atoms){
  const n=atoms.length; let cx=0,cy=0,cz=0;
  atoms.forEach(a=>{cx+=a.x;cy+=a.y;cz+=a.z;}); cx/=n;cy/=n;cz/=n;
  let maxDist=0; atoms.forEach(a=>{ const d=Math.hypot(a.x-cx,a.y-cy,a.z-cz); if(d>maxDist)maxDist=d; });
  return { cx, cy, cz, scale: maxDist>0 ? TARGET_R/maxDist : 1 };
}
function clearProtein(){ if(proteinGroup){ scene.remove(proteinGroup); disposeGroup(proteinGroup); } proteinGroup=new THREE.Group(); }
function frameCamera(){ controls.target.set(0,0,0); camera.position.set(0,0,TARGET_R*2.5); controls.update(); }

// ألوان العناصر (ذرات) أو ألوان السلاسل (شريط)
function legendMode(mode, chainKeys){
  const el=document.getElementById('legend'); el.style.display='flex';
  if(mode==='atoms'){
    el.innerHTML = [['#aaaaaa','C'],['#4488ff','N'],['#ff4444','O'],['#ffdd44','S'],['#ff8800','P']]
      .map(([c,l])=>`<div class="it"><span class="sw" style="background:${c}"></span>${l}</div>`).join('');
  } else {
    el.innerHTML = (chainKeys||[]).map((ch,i)=>{
      const c='#'+CHAIN_COLORS[i%CHAIN_COLORS.length].toString(16).padStart(6,'0');
      return `<div class="it"><span class="sw" style="background:${c}"></span>سلسلة ${ch}</div>`;
    }).join('');
  }
}

// أسلوب الذرات: كل ذرة كرة ملوّنة بالعنصر
function drawAtoms(atoms){
  clearProtein();
  const {cx,cy,cz,scale}=centerScale(atoms);
  const n=atoms.length, step=n>5000?3:n>1800?2:1;
  const groups={};
  for(let i=0;i<n;i+=step){
    const a=atoms[i], el2=a.element.toUpperCase().slice(0,2);
    const key=ATOM_COLORS[el2]!==undefined?el2:(ATOM_COLORS[a.element.slice(0,1).toUpperCase()]!==undefined?a.element.slice(0,1).toUpperCase():'DEFAULT');
    (groups[key]||(groups[key]=[])).push(a);
  }
  const m=new THREE.Matrix4();
  Object.entries(groups).forEach(([el,ats])=>{
    const geo=new THREE.SphereGeometry((ATOM_RADII[el]||ATOM_RADII.DEFAULT)*1.05, 8, 8);
    const mat=new THREE.MeshPhongMaterial({color:ATOM_COLORS[el]||ATOM_COLORS.DEFAULT, shininess:70, transparent:true, opacity:.96});
    const mesh=new THREE.InstancedMesh(geo, mat, ats.length);
    ats.forEach((a,i)=>{ m.setPosition((a.x-cx)*scale,(a.y-cy)*scale,(a.z-cz)*scale); mesh.setMatrixAt(i,m); });
    mesh.instanceMatrix.needsUpdate=true; proteinGroup.add(mesh);
  });
  scene.add(proteinGroup); frameCamera(); legendMode('atoms');
}

function drawRibbon(atoms){
  const chains={};
  atoms.forEach(a=>{ if(a.name==='CA'){ (chains[a.chain]||(chains[a.chain]=[])).push(a); } });
  const keys=Object.keys(chains);
  if(!keys.length){ drawAtoms(atoms); return; }   
  clearProtein();
  const {cx,cy,cz,scale}=centerScale(atoms);
  keys.forEach((ch,ci)=>{
    const cas=chains[ch].sort((p,q)=>p.resSeq-q.resSeq);
    if(cas.length<2) return;
    const pts=cas.map(a=>new THREE.Vector3((a.x-cx)*scale,(a.y-cy)*scale,(a.z-cz)*scale));
    const curve=new THREE.CatmullRomCurve3(pts,false,'catmullrom',0.5);
    const geo=new THREE.TubeGeometry(curve, Math.min(700,cas.length*6), 1.5, 8, false);
    const mat=new THREE.MeshPhongMaterial({color:CHAIN_COLORS[ci%CHAIN_COLORS.length], shininess:55, transparent:true, opacity:.97});
    proteinGroup.add(new THREE.Mesh(geo,mat));
  });
  scene.add(proteinGroup); frameCamera(); legendMode('ribbon', keys);
}

function setMode(mode){
  currentMode=mode;
  document.getElementById('btnAtoms').classList.toggle('on', mode==='atoms');
  document.getElementById('btnRibbon').classList.toggle('on', mode==='ribbon');
  if(!currentAtoms) return;
  if(mode==='ribbon') drawRibbon(currentAtoms); else drawAtoms(currentAtoms);
}

function proxied(url){
  return [
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    `https://corsproxy.io/?${encodeURIComponent(url)}`,
  ];
}

async function loadPDB(pdbId){
  const L=document.getElementById('loading'), msg=document.getElementById('load-msg');
  L.classList.remove('hidden'); L.querySelector('.spin')?.style && (L.querySelector('.spin').style.display='block');
  msg.className=''; msg.textContent='جاري التحميل من RCSB…';
  const rcsb=`https://files.rcsb.org/download/${pdbId}.pdb`;
  return loadStructure([rcsb, ...proxied(rcsb)], msg, L);
}

async function loadAlphaFold(uniprotId){
  const L=document.getElementById('loading'), msg=document.getElementById('load-msg');
  L.classList.remove('hidden'); L.querySelector('.spin')?.style && (L.querySelector('.spin').style.display='block');
  msg.className=''; msg.textContent='جاري الاستعلام من AlphaFold…';
  const id=String(uniprotId).toUpperCase();

  let apiUrls=[];
  const apiEndpoint=`https://alphafold.ebi.ac.uk/api/prediction/${id}`;
  for(const u of [apiEndpoint, ...proxied(apiEndpoint)]){
    try{
      const res=await fetch(u,{signal:AbortSignal.timeout(12000)});
      if(!res.ok) continue;
      const data=await res.json();
      const entry=Array.isArray(data)?data[0]:data;
      if(entry && entry.pdbUrl){ apiUrls=[entry.pdbUrl, ...proxied(entry.pdbUrl)]; break; }
    }catch(e){}
  }

  const guessed=['v6','v5','v4'].map(v=>`https://alphafold.ebi.ac.uk/files/AF-${id}-F1-model_${v}.pdb`);
  const urls=[...apiUrls, ...guessed, ...proxied(guessed[0])];

  msg.textContent='جاري التحميل من AlphaFold…';
  return loadStructure(urls, msg, L);
}


function renderRawPDB(text){
  const L=document.getElementById('loading'), msg=document.getElementById('load-msg');
  try{
    if(!/^ATOM\s|\nATOM\s/.test(text)) throw new Error('نص PDB غير صالح');
    const atoms=parsePDB(text);
    if(!atoms.length) throw new Error('الملف لا يحتوي إحداثيات ذرية');
    currentAtoms = atoms; setMode(currentMode);
    document.getElementById('tSub').textContent = (document.getElementById('tSub').textContent||'') +
      ' · ' + atoms.length.toLocaleString('ar-EG') + ' ذرة';
    L.classList.add('hidden');
  }catch(err){
    const spin=L.querySelector('.spin'); if(spin) spin.style.display='none';
    msg.className='err'; msg.textContent='✕ ' + (err.message||'فشل عرض البنية');
  }
}

async function loadStructure(urls, msg, L){
  try{
    let text=null; const notes=[];
    for(const url of urls){
      const isProxy=/allorigins|corsproxy|codetabs/.test(url);
      try{
        msg.textContent = isProxy ? 'تعذّر الاتصال المباشر — جاري المحاولة عبر وسيط…' : msg.textContent;
        const res=await fetch(url,{signal:AbortSignal.timeout(isProxy?25000:12000)});
        if(!res.ok){ notes.push('HTTP '+res.status); continue; }
        const body=await res.text();
        if(/^ATOM\s|\nATOM\s/.test(body)){ text=body; break; }
        notes.push('رد غير صالح');
      }catch(e){
        notes.push(e && e.name==='TimeoutError' ? 'مهلة' : 'حجب/شبكة');
      }
    }
    if(!text){
      const blocked = notes.filter(n=>n==='حجب/شبكة').length;
      const hint = blocked>=2 ? 'قد يكون بسبب حجب CORS أو الشبكة' : notes.slice(0,3).join(' · ');
      throw new Error('تعذّر تحميل ملف البنية — ' + hint);
    }
    msg.textContent='جاري تحليل البنية الذرية…';
    const atoms=parsePDB(text);
    if(!atoms.length) throw new Error('الملف لا يحتوي إحداثيات ذرية');
    currentAtoms = atoms; setMode(currentMode);
    document.getElementById('tSub').textContent = atoms.length.toLocaleString('ar-EG') + ' ذرة';
    L.classList.add('hidden');
  }catch(err){
    const spin=L.querySelector('.spin'); if(spin) spin.style.display='none';
    msg.className='err'; msg.textContent='✕ ' + (err.message||'فشل التحميل');
  }
}

initThree();
(function boot(){
  const p=new URLSearchParams(location.search);
  const pdb=(p.get('pdb')||'').trim().toUpperCase();
  const uniprot=(p.get('uniprot')||'').trim().toUpperCase();
  const name=p.get('name')||'', gene=p.get('gene')||'';
  const tc=document.getElementById('titleCard');
  if(pdb){
    tc.style.display='block';
    document.getElementById('tTitle').textContent = name || pdb;
    document.getElementById('tSub').textContent = (gene?gene+' · ':'') + pdb;
    loadPDB(pdb);
  } else if(uniprot){
  
    tc.style.display='block';
    document.getElementById('tTitle').textContent = name || uniprot;
    document.getElementById('tSub').textContent = (gene?gene+' · ':'') + 'AlphaFold';
    loadAlphaFold(uniprot);
  } else {
    const L=document.getElementById('loading'); L.querySelector('.spin').style.display='none';
    document.getElementById('load-msg').textContent='لم يُحدَّد معرّف بنية';
  }
})();

window.addEventListener('message', e=>{
  if(e.data && e.data.type==='load-pdb' && e.data.pdb){
    document.getElementById('titleCard').style.display='block';
    document.getElementById('tTitle').textContent = e.data.name || e.data.pdb;
    loadPDB(String(e.data.pdb).toUpperCase());
  }
  if(e.data && e.data.type==='load-pdb-raw' && e.data.pdbText){
    document.getElementById('titleCard').style.display='block';
    document.getElementById('tTitle').textContent = e.data.name || 'ESMFold';
    document.getElementById('tSub').textContent = e.data.sub || '';
    renderRawPDB(e.data.pdbText);
  }
});
</script>
