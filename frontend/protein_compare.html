<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChromoGen · مقارنة البروتين</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Cairo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b221e;
    --scene: #081b18;
    --fg: #dfeee2;
    --muted: #7f9c8b;
    --primary: #8eb69b;
    --primary-deep: #43705d;
    --border: rgba(223, 238, 226, 0.10);
    --card: rgba(14, 38, 33, 0.72);
    --card-solid: #0e2621;
    --patient: #e5766f;
    --patient-text: #ff8c82;
    --patient-pill-bg: #b0362f;
    --control: #8eb69b;
    --font-display: "Space Grotesk", "Cairo", sans-serif;
    --font-sans: "Inter", "Cairo", sans-serif;
    --font-mono: "JetBrains Mono", monospace;
    --r: 14px;
  }
  :root[data-theme="light"]{
    --bg: #f3fcf6; 
    --scene: #0a201d; 
    --fg: #0c1f17; 
    --muted: #4a645a;
    --primary: #214c3d; 
    --primary-deep: #163529;
    --border: #cddcd2; 
    --card: #f9fffb; 
    --card-solid: #ffffff;
    --control: #5b6f74; 
    --patient-text: #b0362f;
    --patient-pill-bg: #e5766f;
  }

  /* ── أزرق ── */
  :root[data-accent="blue"]{
    --bg:#171b26; --scene:#11141d; --fg:#e7e9ee; --muted:#819ada; --primary:#819ada; --primary-deep:#2c4a96;
    --border:rgba(63,67,78,.16); --card:rgba(23,27,38,.72); --card-solid:#262c3b;
  }
  :root[data-theme="light"][data-accent="blue"]{
    --bg:#f6f7f8; --scene:#11141d; --fg:#15171e; --muted:#495c8d; --primary:#2b4482; --primary-deep:#1f325f;
    --border:rgba(21,23,30,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── بنفسجي ── */
  :root[data-accent="purple"]{
    --bg:#1f1a24; --scene:#17131b; --fg:#ebe8ed; --muted:#b18dce; --primary:#b18dce; --primary-deep:#653a88;
    --border:rgba(71,66,76,.16); --card:rgba(31,26,36,.72); --card-solid:#312938;
  }
  :root[data-theme="light"][data-accent="purple"]{
    --bg:#f7f7f8; --scene:#17131b; --fg:#1a161d; --muted:#6e5582; --primary:#5a3875; --primary-deep:#422955;
    --border:rgba(26,22,29,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── ليلكي ── */
  :root[data-accent="lilac"]{
    --bg:#201c21; --scene:#181519; --fg:#ebeaec; --muted:#b79ac1; --primary:#b79ac1; --primary-deep:#6c4a78;
    --border:rgba(72,68,73,.16); --card:rgba(32,28,33,.72); --card-solid:#322d34;
  }
  :root[data-theme="light"][data-accent="lilac"]{
    --bg:#f7f7f8; --scene:#181519; --fg:#1a181b; --muted:#706176; --primary:#5f4667; --primary-deep:#45334b;
    --border:rgba(26,24,27,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── زهري ── */
  :root[data-accent="rose"]{
    --bg:#24191b; --scene:#1c1214; --fg:#ede8e9; --muted:#d18996; --primary:#d18996; --primary-deep:#8b3646;
    --border:rgba(76,65,67,.16); --card:rgba(36,25,27,.72); --card-solid:#39282b;
  }
  :root[data-theme="light"][data-accent="rose"]{
    --bg:#f8f7f7; --scene:#1c1214; --fg:#1d1617; --muted:#85525b; --primary:#793541; --primary-deep:#58272f;
    --border:rgba(29,22,23,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── خمري ── */
  :root[data-accent="wine"]{
    --bg:#281519; --scene:#1f0f12; --fg:#efe7e8; --muted:#e2788b; --primary:#e2788b; --primary-deep:#9f2239;
    --border:rgba(80,61,65,.16); --card:rgba(40,21,25,.72); --card-solid:#3e2328;
  }
  :root[data-theme="light"][data-accent="wine"]{
    --bg:#f8f6f7; --scene:#1f0f12; --fg:#1f1416; --muted:#944251; --primary:#8b2335; --primary-deep:#651a27;
    --border:rgba(31,20,22,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── ذهبي ── */
  :root[data-accent="gold"]{
    --bg:#282215; --scene:#1f190f; --fg:#efece7; --muted:#e2be78; --primary:#e2be78; --primary-deep:#9f7522;
    --border:rgba(80,74,61,.16); --card:rgba(40,34,21,.72); --card-solid:#3e3523;
  }
  :root[data-theme="light"][data-accent="gold"]{
    --bg:#f8f8f6; --scene:#1f190f; --fg:#1f1b14; --muted:#947842; --primary:#8b6723; --primary-deep:#654b1a;
    --border:rgba(31,27,20,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── رمادي ── */
  :root[data-accent="slate"]{
    --bg:#1c2021; --scene:#151819; --fg:#eaebec; --muted:#9ab5c1; --primary:#9ab5c1; --primary-deep:#4a6a78;
    --border:rgba(68,72,73,.16); --card:rgba(28,32,33,.72); --card-solid:#2d3234;
  }
  :root[data-theme="light"][data-accent="slate"]{
    --bg:#f7f7f8; --scene:#151819; --fg:#181a1b; --muted:#616f76; --primary:#465d67; --primary-deep:#33444b;
    --border:rgba(24,26,27,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }


  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-sans); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--border); }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .theme-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    border-radius: 8px; border: 1px solid color-mix(in srgb, var(--fg) 20%, transparent); background: var(--card-solid); color: var(--fg);
    cursor: pointer; transition: border-color .15s; flex: none; }
  .theme-btn:hover { border-color: color-mix(in srgb, var(--primary) 45%, transparent); }
  .theme-btn svg { width: 15px; height: 15px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; }
  .brand .mark { width: 32px; height: 32px; border-radius: 9px; background: var(--primary); color: var(--card-solid); display: flex; align-items: center; justify-content: center; }
  .brand .mark svg{ width:18px; height:18px; }
  main { max-width: 1400px; margin: 0 auto; padding: 20px; }
  #status { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pane { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; min-height: 420px; display: flex; flex-direction: column; }
  .pane-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .badge { font-size: 11px; padding: 4px 12px; border-radius: 999px; }
  .pane.control .badge { background: color-mix(in srgb, var(--control) 18%, transparent); color: var(--control); }
  .pane.patient .badge { background: color-mix(in srgb, var(--patient) 18%, transparent); color: var(--patient); }
  .pane-body { flex: 1; position: relative; }
  .pane-body iframe { width: 100%; height: 100%; border: 0; display: block; }
  .empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }

  .dark-inspector-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }

  .dark-track-panel {
    background: var(--card-solid);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }

  .dark-track-content {
    display: flex;
    align-items: center;
    gap: 20px;
    direction: ltr;
  }

  .dark-track-labels {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    height: 64px;
    border-right: 1px solid var(--border);
    padding-right: 16px;
    min-width: 45px;
    user-select: none;
  }

  .dark-track-scroll {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 8px;
    flex: 1;
    scrollbar-width: thin;
    scrollbar-color: var(--primary-deep) transparent;
  }

  .dark-track-scroll::-webkit-scrollbar {
    height: 6px;
  }
  .dark-track-scroll::-webkit-scrollbar-track {
    background: color-mix(in srgb, var(--fg) 10%, transparent);
    border-radius: 10px;
  }
  .dark-track-scroll::-webkit-scrollbar-thumb {
    background: var(--primary-deep);
    border-radius: 10px;
  }
  .dark-track-scroll::-webkit-scrollbar-thumb:hover {
    background: var(--primary);
  }

  .dark-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 36px;
    gap: 4px;
  }

  .dark-col .idx {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--muted);
  }

  .dark-col .dna-code {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--fg);
  }

  .dark-col .mrna-code {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--primary);
  }

  .dark-col .aa-circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--primary) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--primary) 20%, transparent);
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    margin-top: 2px;
  }

  .dark-col.is-mutated .dna-code,
  .dark-col.is-mutated .mrna-code {
    color: var(--patient-text) !important;
    font-weight: 800;
  }

  .dark-col.is-stop .aa-circle {
    width: 38px;
    border-radius: 12px;
    background: var(--patient);
    border-color: var(--patient);
    color: #ffffff;
    font-weight: 700;
    box-shadow: 0 0 10px rgba(229, 118, 111, 0.4);
  }

  .tbl-card {
    background: var(--card-solid);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-top: 16px;
  }

  .tbl-head-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .tbl-btn {
    background: color-mix(in srgb, var(--primary) 8%, transparent);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 6px 14px;
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tbl-btn:hover {
    background: color-mix(in srgb, var(--primary) 18%, transparent);
    border-color: var(--primary);
  }

  .genocore-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-mono);
    font-size: 11px;
    text-align: right;
  }

  .genocore-table th {
    padding: 10px 12px;
    color: var(--muted);
    font-size: 10px;
    border-bottom: 1px solid var(--border);
  }

  .genocore-table td {
    padding: 10px 12px;
    border-bottom: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
    color: var(--fg);
  }

  .mutated-pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 6px;
    background: var(--patient-pill-bg);
    border: 1px solid var(--patient-pill-bg);
    color: #ffffff;
    font-weight: 700;
  }

  .tbl-pagination {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
  }

  .page-nums {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .page-btn {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    cursor: pointer;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
  }

  .page-btn.active {
    background: color-mix(in srgb, var(--primary) 20%, transparent);
    border-color: var(--primary);
    color: var(--fg);
    font-weight: 600;
  }

    /* شريط القياس والمواقع الجينومية العلوية */
  .genome-scale-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 12px;
    padding-left: 65px; /* لتطبيق نفس المحاذاة مع الكودونات */
  }

  /* الكودون الواحد - العمود */
  .video-style-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    min-width: 90px;
  }

  .video-style-col .codon-num {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 2px;
  }

  /* صف المربعات (DNA/RNA Triplet) */
  .nucleotide-row {
    display: flex;
    gap: 4px;
  }

  /* مربع النيوكليوتيد السكني */
  .nuc-box {
    width: 26px;
    height: 28px;
    background: #1e232a;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: #c5ced8;
  }

  /* حالة المربع المصاب بالطفرة */
  .nuc-box.is-mutated {
    border-color: #ff5252;
    color: #ffffff;
    background: rgba(255, 82, 82, 0.15);
    box-shadow: 0 0 8px rgba(255, 82, 82, 0.3);
  }

  /* مستطيل الحمض الأميني (AA Label) */
  .aa-box {
    width: 100%;
    height: 32px;
    background: #1e232a;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: #dfeee2;
    margin-top: 4px;
  }

  /* في حال كان الحمض المتغير Stop */
  .aa-box.is-stop {
    background: #b0362f;
    color: #ffffff;
    border-color: #ff8c82;
  }

  .ge-section {
    background: var(--card-solid);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-top: 16px;
    position: relative;
  }

  .ge-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    direction: rtl;
  }

  .ge-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ge-title-bar {
    width: 4px;
    height: 18px;
    background: var(--primary);
    border-radius: 999px;
  }

  .ge-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    color: var(--fg);
    margin: 0;
  }

  .ge-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(229, 118, 111, 0.12);
    border: 1px solid rgba(229, 118, 111, 0.3);
    direction: ltr;
  }

  .ge-badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff5252;
    box-shadow: 0 0 8px #ff5252;
    animation: gePing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
  }

  @keyframes gePing {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.2); }
  }

  .ge-badge .lbl {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    color: #ff8c82;
    letter-spacing: 0.05em;
  }

  .ge-badge .code-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg);
    background: color-mix(in srgb, var(--fg) 8%, transparent);
    padding: 2px 8px;
    border-radius: 4px;
  }

  .ge-scroll-wrap {
    width: 100%;
    overflow-x: auto;
    padding-bottom: 12px;
    direction: ltr;
  }

  .ge-scroll-wrap::-webkit-scrollbar { height: 6px; }
  .ge-scroll-wrap::-webkit-scrollbar-track { background: color-mix(in srgb, var(--fg) 4%, transparent); border-radius: 4px; }
  .ge-scroll-wrap::-webkit-scrollbar-thumb { background: var(--primary-deep); border-radius: 4px; }

  .ge-tracks {
    min-width: 850px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* الصف الرابط والمسطرة */
  .ge-track-row {
    display: flex;
    align-items: stretch;
    background: color-mix(in srgb, var(--fg) 4%, var(--card-solid));
    border-radius: 8px;
    overflow: hidden;
  }

  .ge-track-row.alt {
    background: var(--bg);
    border: 1px solid color-mix(in srgb, var(--fg) 4%, transparent);
  }

  .ge-track-lbl {
    width: 120px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 14px;
    padding-top: 8px;
    padding-bottom: 8px;
    border-right: 1px solid color-mix(in srgb, var(--fg) 6%, transparent);
    background: color-mix(in srgb, var(--fg) 2%, transparent);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
  }

  .ge-track-lbl.strong {
    color: var(--fg);
    font-weight: 600;
  }

  .ge-track-lbl .pat-dot {
    width: 6px;
    height: 6px;
    background: #ff5252;
    border-radius: 50%;
    margin-left: 6px;
  }

  .ge-track-content {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 6px 20px;
    gap: 16px;
  }

  /* مظهر الكودونات والقواعد */
  .ge-codon-group {
    display: flex;
    align-items: center;
    gap: 3px;
    position: relative;
  }

  .ge-base-box {
    width: 24px;
    height: 26px;
    background: color-mix(in srgb, var(--fg) 8%, var(--bg));
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--primary);
  }

  .ge-base-box.is-mut {
    background: rgba(229, 118, 111, 0.2);
    border: 1px solid #ff5252;
    color: #ffffff;
    font-weight: 800;
    box-shadow: 0 0 8px rgba(255, 82, 82, 0.4);
    position: relative;
  }

  /* نقطة نابضة فوق القاعدة المتحوّرة بالضبط —  */
  .ge-base-box.is-mut::after {
    content: '';
    position: absolute;
    top: -3px; right: -3px;
    width: 8px; height: 8px;
    background: #ff5252;
    border-radius: 50%;
    animation: gePing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
  }

  .ge-codon-idx {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    opacity: 0.6;
    text-align: center;
    width: 78px;
  }

  /* مستطيلات الأحماض الأمينية */
  .ge-aa-pill {
    width: 78px;
    height: 26px;
    background: color-mix(in srgb, var(--fg) 8%, var(--bg));
    border: 1px solid color-mix(in srgb, var(--fg) 5%, transparent);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
  }

  .ge-aa-pill.is-mut-aa {
    background: rgba(229, 118, 111, 0.25);
    border-color: #ff5252;
    color: #ff8c82;
    font-weight: 700;
    box-shadow: 0 0 10px rgba(229, 118, 111, 0.2);
  }

  .ge-aa-pill.is-stop {
    background: #b0362f;
    border-color: #ff8c82;
    color: #ffffff;
    font-weight: 700;
  }
</style>


</head>
<body>
<script>
(function(){
  try{
    var p = new URLSearchParams(location.search);
    var stored = localStorage.getItem('chromogen-theme');
    if(stored==='light' || p.get('theme')==='light') document.documentElement.setAttribute('data-theme','light');

    var storedAccent = p.get('accent') || localStorage.getItem('chromogen-accent');
    if(storedAccent && storedAccent!=='green') document.documentElement.setAttribute('data-accent', storedAccent);
  }catch(e){}
  window.addEventListener('storage', function(e){
    if(e.key==='chromogen-theme'){
      document.documentElement.setAttribute('data-theme', e.newValue==='light' ? 'light' : 'dark');
    }
    if(e.key==='chromogen-accent'){
      if(e.newValue && e.newValue!=='green') document.documentElement.setAttribute('data-accent', e.newValue);
      else document.documentElement.removeAttribute('data-accent');
    }
  });
})();

let theme = (()=>{ try{ return localStorage.getItem('chromogen-theme') || 'dark'; }catch(e){ return 'dark'; } })();
function applyTheme(){
  if(theme==='light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  const sun = document.getElementById('themeIconSun'), moon = document.getElementById('themeIconMoon');
  if(sun && moon){ sun.style.display = theme==='light'?'block':'none'; moon.style.display = theme==='light'?'none':'block'; }
  try{ localStorage.setItem('chromogen-theme', theme); }catch(e){}
}
applyTheme();
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('btnTheme')?.addEventListener('click', ()=>{ theme = theme==='dark'?'light':'dark'; applyTheme(); });
  applyTheme();
});
window.addEventListener('storage', function(e){
  if(e.key==='chromogen-theme'){ theme = e.newValue==='light' ? 'light' : 'dark'; applyTheme(); }
});
</script>

<main>

  <div id="cols" class="cols" style="display:none"></div>

<script>
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function normalizeGene(name){ return String(name||'').trim().toUpperCase(); }
const NAME_CACHE = new Map();

async function searchRCSBByAccession(acc){
  const r2 = await fetch(`https://search.rcsb.org/rcsbsearch/v2/query`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      query:{type:'terminal', service:'full_text', parameters:{value:acc}},
      return_type:'entry'
    }), signal: AbortSignal.timeout(15000)
  });
  if(!r2.ok) return null;
  const j = await r2.json();
  return j?.result_set?.[0]?.identifier || null;
}

async function resolveByGeneName(name){
  const gene = normalizeGene(name);
  if(!gene || gene.length < 2) return null;
  if(NAME_CACHE.has(gene)) return NAME_CACHE.get(gene);
  let out = null;
  try{
    const uq = 'https://rest.uniprot.org/uniprotkb/search'
      + `?query=gene_exact:${encodeURIComponent(gene)}+AND+organism_id:9606+AND+reviewed:true`
      + '&fields=accession&format=json&size=1';
    const ur = await fetch(uq, {signal: AbortSignal.timeout(12000)});
    const acc = ur.ok ? (await ur.json())?.results?.[0]?.primaryAccession : null;
    if(acc){
      let pdbId = null;
      try{ pdbId = await searchRCSBByAccession(acc); }catch(e){}
      if(pdbId) out = {kind:'pdb', value:pdbId, source:'experimental', accession:acc};
      else out = {kind:'uniprot', value:acc, source:'predicted', accession:acc};
    }
  }catch(e){}
  NAME_CACHE.set(gene, out);
  return out;
}

function renderPane(side, label){
  return `
    <div class="pane ${side}">
      <div class="pane-head">
        <b>${label}</b>
        <span class="badge" id="badge-${side}" style="display:none"></span>
      </div>
      <div class="pane-body" id="body-${side}">
        <div class="empty-state" id="status-${side}">جاري التحضير...</div>
      </div>
    </div>`;
}

async function foldWithESMFold(sequence){
  const clean = String(sequence||'').replace(/[^A-Za-z]/g,'').toUpperCase();
  if(!clean || clean.length < 3) throw new Error('تسلسل فارغ أو قصير جداً');
  if(clean.length > 768) throw new Error('التسلسل أطول من الحد المسموح (768 حمض أميني) لهذه الخدمة');
  const res = await fetch('https://api.esmatlas.com/foldSequence/v1/pdb/', {
    method:'POST', body:clean, signal:AbortSignal.timeout(30000)
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const text = await res.text();
  if(!/^ATOM\s|\nATOM\s/.test(text)) throw new Error('رد غير صالح من الخدمة');
  return text;
}

async function loadPaneStructure(side, label, sequence, fallbackResolved, proteinName, geneName){
  const bodyEl = document.getElementById('body-'+side);
  const statusEl = document.getElementById('status-'+side);
  const badgeEl = document.getElementById('badge-'+side);
  const frameId = 'frame-'+side;

  bodyEl.innerHTML = `<iframe id="${frameId}" src="protein_viewer.html"></iframe>`;
  const frame = document.getElementById(frameId);
  const frameReady = new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));

  const showReference = async ()=>{
    if(!fallbackResolved) return false;
    badgeEl.style.display='inline-block';
    badgeEl.textContent = fallbackResolved.source==='predicted' ? 'AlphaFold — بنية مرجعية معروفة' : 'RCSB — بنية تجريبية معروفة';
    badgeEl.style.background='color-mix(in srgb, var(--control) 18%, transparent)'; badgeEl.style.color='var(--control)';
    const common = `name=${encodeURIComponent(proteinName||'')}&gene=${encodeURIComponent(geneName||'')}`;
    frame.src = fallbackResolved.kind==='pdb'
      ? `protein_viewer.html?pdb=${encodeURIComponent(fallbackResolved.value)}&${common}`
      : `protein_viewer.html?uniprot=${encodeURIComponent(fallbackResolved.value)}&${common}`;
    return true;
  };

  const showESMFold = async ()=>{
    if(!sequence || sequence.length < 3) return false;
    try{
      const pdbText = await foldWithESMFold(sequence);
      badgeEl.style.display='inline-block'; badgeEl.textContent='ESMFold — تسلسل حقيقي';
      badgeEl.style.background='color-mix(in srgb, var(--patient) 16%, transparent)'; badgeEl.style.color='var(--patient)';
      await frameReady;
      frame.contentWindow.postMessage({type:'load-pdb-raw', pdbText, name:proteinName, sub:`ESMFold · ${sequence.length} حمض أميني`}, '*');
      return true;
    }catch(err){
      console.warn('[ESMFold] فشل الطي لـ', side, err.message);
      return false;
    }
  };

  statusEl?.remove();
  let ok;
  if(side==='control'){
    ok = await showReference();
    if(!ok) ok = await showESMFold();
  } else {
    ok = await showESMFold();
    if(!ok) ok = await showReference();
  }
  if(!ok) bodyEl.innerHTML = `<div class="empty-state">تعذّر الحصول على بنية ثلاثية الأبعاد لهذا البروتين من أي مصدر.</div>`;
}

async function boot(){
  const params = new URLSearchParams(location.search);
  const outputId = params.get('output_id');
  const geneName = params.get('gene') || '';
  const proteinName = params.get('protein') || geneName;
  const token = params.get('token') || localStorage.getItem('chromogen-token') || '';
  const base = (window.CHROMO_API_BASE || 'http://127.0.0.1:8000/api').replace(/\/$/,'');
  const status = document.getElementById('status');
  document.getElementById('proteinLabel').textContent = proteinName;

  if(!outputId || !geneName){ status.textContent = 'يلزم output_id و gene بالرابط.'; return; }

  let geneData = null;
  try{
    const headers = {'Accept':'application/json'};
    if(token) headers['Authorization'] = 'Bearer '+token;
    const listRes = await fetch(`${base}/genomics/output/${outputId}/genes/`, {headers});
    if(listRes.ok){
      const list = await listRes.json();
      const match = (list||[]).find(g => (g.gene_name||'').toUpperCase() === geneName.toUpperCase());
      if(match){
        const detRes = await fetch(`${base}/genomics/output/${outputId}/genes/${encodeURIComponent(match.gene_id)}/`, {headers});
        if(detRes.ok) geneData = await detRes.json();
      }
    }
  }catch(e){}

  status.remove();
  const cols = document.getElementById('cols');
  cols.style.display = 'grid';
  cols.innerHTML = renderPane('control', 'السليم') + renderPane('patient', 'المريض');

  let fallbackResolved = null;
  try{ fallbackResolved = await resolveByGeneName(proteinName); }catch(e){}

  loadPaneStructure('control', 'السليم', geneData?.control_amino_acid_sequence, fallbackResolved, proteinName, geneName);
  loadPaneStructure('patient', 'المريض', geneData?.patient_amino_acid_sequence, fallbackResolved, proteinName, geneName);

  document.getElementById('geneExprSection').innerHTML = renderGeneExpression(geneData);
  syncTrackScroll();
}

function mrnaToDna(mrna){
  return mrna ? mrna.toUpperCase().replace(/U/g, 'T') : null;
}


/* بناء الـ 5 مسارات الجينومية بالكامل مع المحاذاة الدقيقة */
function buildGeneExpressionTrack(controlDna, patientDna, controlAA, patientAA, mutatedCodons = []) {
  if (!controlDna && !patientDna) return '<p style="font-size:12px; color:var(--muted); padding:20px;">لا تتوفر بيانات التسلسل الجيني.</p>';

  const mutMap = new Map((mutatedCodons || []).map(c => [c.codon_number, c]));
  const refSeq = controlDna || (patientDna || '');
  const patSeq = patientDna || refSeq;
  const totalCodons = Math.floor(Math.max(refSeq.length, patSeq.length) / 3);

  let rulerItems = '';
  let refDnaItems = '';
  let patDnaItems = '';
  let refAaItems = '';
  let patAaItems = '';

  for (let i = 0; i < totalCodons; i++) {
    const codonNum = i + 1;
    const refTriplet = (refSeq.substr(i * 3, 3) || '---').padEnd(3, '-').split('');
    const patTriplet = (patSeq.substr(i * 3, 3) || '---').padEnd(3, '-').split('');
    const mutData = mutMap.get(codonNum);
    const isDiff = !!mutData;

    let refAA = controlAA ? (controlAA[i] || '—') : '—';
    let patAA = patientAA ? (patientAA[i] || '—') : (controlAA ? (controlAA[i] || '—') : '—');
    
    const patIsStop = isDiff && (patAA === '*' || patAA === 'STOP' || mutData.patient_amino_acid === '*');
    if (patIsStop) patAA = 'Stop';
    if (refAA === '*') refAA = 'Stop';

    // 1. المسطرة وأرقام الكودونات
    rulerItems += `<div class="ge-codon-idx">${codonNum}</div>`;

    // 2. مربعات DNA السليم (Ref)
    const refBoxes = refTriplet.map(ch => `<div class="ge-base-box">${ch}</div>`).join('');
    refDnaItems += `<div class="ge-codon-group">${refBoxes}</div>`;

    // 3. مربعات DNA المريض (Pat) مع تمييز القواعد الطافرة بدقة
    const baseDiff = [false, false, false];
    if (isDiff) {
      for (let b = 0; b < 3; b++) { if (refTriplet[b] !== patTriplet[b]) baseDiff[b] = true; }
    }
    const patBoxes = patTriplet.map((ch, b) => 
      `<div class="ge-base-box ${baseDiff[b] ? 'is-mut' : ''}">${ch}</div>`
    ).join('');
    patDnaItems += `<div class="ge-codon-group">${patBoxes}</div>`;

    // 4. مستطيل الحمض الأميني السليم (AA Ref)
    refAaItems += `<div class="ge-aa-pill">${esc(refAA)}</div>`;

    // 5. مستطيل الحمض الأميني للمريض (AA Pat)
    patAaItems += `<div class="ge-aa-pill ${patIsStop ? 'is-stop' : (isDiff ? 'is-mut-aa' : '')}">${esc(patAA)}</div>`;
  }

  return `
    <div class="ge-tracks">
      <!-- 1. Ruler / Index Track -->
      <div class="ge-track-row" style="background:transparent;">
        <div class="ge-track-lbl" style="background:transparent; border:none; font-family:var(--font-mono); font-size:11px;">INDEX</div>
        <div class="ge-track-content">${rulerItems}</div>
      </div>

      <!-- 2. DNA (Ref) -->
      <div class="ge-track-row">
        <div class="ge-track-lbl">DNA (Ref)</div>
        <div class="ge-track-content">${refDnaItems}</div>
      </div>

      <!-- 3. DNA (Pat) -->
      <div class="ge-track-row">
        <div class="ge-track-lbl strong">DNA (Pat)<span class="pat-dot"></span></div>
        <div class="ge-track-content">${patDnaItems}</div>
      </div>

      <div style="height:4px;"></div>

      <!-- 4. AA (Ref) -->
      <div class="ge-track-row alt">
        <div class="ge-track-lbl">AA (Ref)</div>
        <div class="ge-track-content">${refAaItems}</div>
      </div>

      <!-- 5. AA (Pat) -->
      <div class="ge-track-row alt">
        <div class="ge-track-lbl strong">AA (Pat)</div>
        <div class="ge-track-content">${patAaItems}</div>
      </div>
    </div>
  `;
}


function syncTrackScroll(){
  const a = document.getElementById('track-scroll-control');
  const b = document.getElementById('track-scroll-patient');
  if(!a || !b) return;
  let syncing = false;
  const link = (from, to) => from.addEventListener('scroll', ()=>{
    if(syncing) return;
    syncing = true; to.scrollLeft = from.scrollLeft; syncing = false;
  });
  link(a,b); link(b,a);
}

function exportCodonsCSV(){
  const codons = window.MUTATED_CODONS_DATA || [];
  const geneName = window.CURRENT_GENE_NAME || 'gene';
  if(!codons.length){ alert('لا توجد كودونات متغيّرة لتصديرها.'); return; }
  const head = ['codon_number','reference_codon','reference_amino_acid','patient_codon','patient_amino_acid','genomic_position'];
  const esc2 = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const csv = [head.join(',')].concat(codons.map(c => [
    c.codon_number, c.reference_codon, c.reference_amino_acid,
    c.patient_codon, c.patient_amino_acid, c.genomic_position
  ].map(esc2).join(','))).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${geneName}_mutated_codons.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

window.CODONS_PAGE_SIZE = 8;
window.CODONS_CURRENT_PAGE = 1;
window.MUTATED_CODONS_DATA = [];

function changeCodonPage(newPage) {
  const totalCodons = window.MUTATED_CODONS_DATA.length;
  const totalPages = Math.ceil(totalCodons / window.CODONS_PAGE_SIZE);

  if (newPage < 1 || newPage > totalPages) return;

  window.CODONS_CURRENT_PAGE = newPage;

  const container = document.getElementById('genocoreTableContainer');
  if (container) {
    container.innerHTML = renderCodonTableBody(window.MUTATED_CODONS_DATA);
  }
}

function renderCodonTableBody(codons) {
  if (!codons || !codons.length) {
    return `<p style="font-size:11px; color:var(--muted); text-align:center; padding:20px 0;">لا توجد كودونات متغيرة — التسلسل مطابق تماماً.</p>`;
  }

  const pageSize = window.CODONS_PAGE_SIZE;
  const page = window.CODONS_CURRENT_PAGE;
  const totalCodons = codons.length;
  const totalPages = Math.ceil(totalCodons / pageSize);

  const startIndex = (page - 1) * pageSize;
  const pageCodons = codons.slice(startIndex, startIndex + pageSize);

  const rowsHtml = pageCodons.map(c => `
    <tr>
      <td style="color:var(--muted); font-weight:500;">#${c.codon_number}</td>
      <td style="color:var(--fg);">${esc(c.reference_codon)} <span style="color:var(--muted); font-size:10px;">(${esc(c.reference_amino_acid)})</span></td>
      <td>
        <span class="mutated-pill">
          ${esc(c.patient_codon)} (${esc(c.patient_amino_acid)})
        </span>
      </td>
      <td style="direction:ltr; text-align:right; color:var(--muted);">${c.genomic_position?.toLocaleString?.() ?? '—'}</td>
    </tr>
  `).join('');

  let pageBtnsHtml = `<span class="page-btn ${page === 1 ? 'disabled' : ''}" style="opacity:${page === 1 ? 0.3 : 1}; cursor:${page === 1 ? 'default' : 'pointer'}" onclick="changeCodonPage(${page - 1})">‹</span>`;

  for (let p = 1; p <= totalPages; p++) {
    if (p === 1 || p === totalPages || (p >= page - 1 && p <= page + 1)) {
      pageBtnsHtml += `<span class="page-btn ${p === page ? 'active' : ''}" onclick="changeCodonPage(${p})">${p}</span>`;
    } else if (p === page - 2 || p === page + 2) {
      pageBtnsHtml += `<span style="font-size:10px; color:var(--muted); opacity:.6; user-select:none;">...</span>`;
    }
  }

  pageBtnsHtml += `<span class="page-btn ${page === totalPages ? 'disabled' : ''}" style="opacity:${page === totalPages ? 0.3 : 1}; cursor:${page === totalPages ? 'default' : 'pointer'}" onclick="changeCodonPage(${page + 1})">›</span>`;

  return `
    <div style="overflow-x:auto;">
      <table class="genocore-table">
        <thead>
          <tr>
            <th style="width:15%"># الكودون</th>
            <th style="width:30%">السليم (كودون / حمض)</th>
            <th style="width:30%">المريض (كودون / حمض)</th>
            <th style="width:25%; direction:ltr; text-align:right">الموقع الجينومي</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>

    <div class="tbl-pagination">
      <span>Showing ${startIndex + 1}-${Math.min(startIndex + pageSize, totalCodons)} of ${totalCodons} variations</span>
      <div class="page-nums">
        ${pageBtnsHtml}
      </div>
    </div>
  `;
}

function renderGeneExpression(geneData) {
  if (!geneData) {
    return `<div class="dark-inspector-card" style="text-align:center; color:var(--muted); font-size:13px">
      لا تتوفّر بيانات تعبير جيني حقيقية لهذا الجين ضمن هذا التحليل.</div>`;
  }

  const mut = geneData.mutation_type || 'MISSENSE';
  const codons = geneData.mutated_codons || [];

  window.MUTATED_CODONS_DATA = codons;
  window.CURRENT_GENE_NAME = geneData.gene_name || 'gene';
  window.CODONS_CURRENT_PAGE = 1;

  const controlDna = mrnaToDna(geneData.control_mrna_sequence);
  const patientDna = mrnaToDna(geneData.patient_mrna_sequence);
  const firstMutCode = codons[0] ? `c.${codons[0].genomic_position ?? codons[0].codon_number}${esc(codons[0].reference_codon||'')}&gt;${esc(codons[0].patient_codon||'')}` : 'c.5266dupC';

  const trackHtml = buildGeneExpressionTrack(
    controlDna, patientDna,
    geneData.control_amino_acid_sequence, geneData.patient_amino_acid_sequence,
    codons
  );

  return `
  <div class="ge-section">
    <!-- Header Area -->
    <div class="ge-header">
      <div class="ge-title-wrap">
        <div class="ge-title-bar"></div>
        <h2 class="ge-title">التعبير الجيني / Gene Expression</h2>
      </div>
      <div class="ge-badge">
        <span class="dot"></span>
        <span class="lbl">MUTATION: ${esc(mut.toUpperCase())}</span>
        <span class="code-pill">${firstMutCode}</span>
      </div>
    </div>

    <!-- Tracks Container -->
    <div class="ge-scroll-wrap">
      ${trackHtml}
    </div>

    <!-- Codon Table Container -->
    <div class="tbl-card">
      <div class="tbl-head-bar">
        <div>
          <h3 style="margin:0; font-family:var(--font-display); font-size:15px; color:var(--fg);">جدول التغيرات الكودونية التفصيلي</h3>
        </div>
        <div class="tbl-btn-group">
          <button class="tbl-btn" onclick="exportCodonsCSV()">EXPORT</button>
        </div>
      </div>
      <div id="genocoreTableContainer">
        ${renderCodonTableBody(codons)}
      </div>
    </div>
  </div>`;
}

boot();
</script>
</body>
</html>
