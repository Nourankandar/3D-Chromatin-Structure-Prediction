<!doctype html>
<html lang="en" dir="ltr" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Helix — Genomic Analysis Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/chromogen.css">


<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<div id="toasts"></div>

<!-- ============================ LANDING ============================ -->
<div id="screen-landing">
  <header style="position:sticky;top:0;z-index:40;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent);background:color-mix(in srgb,var(--background) 75%,transparent);backdrop-filter:blur(8px)">
    <div class="wrap" style="padding:0 1rem;height:64px;display:flex;align-items:center;justify-content:space-between">
      <div class="logo"><span class="mark" data-icon="dna"></span><div><div class="name" data-t="brand"></div></div></div>
      <div class="row">
        <button class="btn outline sm js-lang"></button>
        <button class="btn outline icon sm js-theme"></button>
        <button class="btn lg" data-go="login"><span data-t="landing_cta"></span></button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="grid-bg mask" style="position:absolute;inset:0;opacity:.35;pointer-events:none"></div>
    <div class="hero-dots" id="heroDots"></div>
    <div class="inner">
      <div class="reveal-load" style="position:relative;z-index:1">
        <span class="pill"><span style="width:6px;height:6px;border-radius:999px;background:var(--primary)" class="dot pulse"></span><span data-t="landing_status"></span></span>
        <h1 style="margin-top:1.25rem"><span data-t="landing_hero_a"></span> <em data-t="landing_hero_b"></em> <span data-t="landing_hero_c"></span></h1>
        <p class="sub" data-t="landing_sub"></p>
        <div class="row" style="margin-top:2rem;flex-wrap:wrap">
          <button class="btn lg" data-go="login"><span data-t="landing_cta"></span></button>
          <a class="btn lg outline" href="#features"><span data-t="landing_cta_secondary"></span></a>
        </div>
      </div>
      <div style="position:relative;z-index:1">
        <canvas id="helixCanvas" style="width:100%;height:440px;display:block"></canvas>
      </div>
    </div>
  </section>

  <section class="section" id="features">
    <div class="inner">
      <h2 class="reveal" style="font-size:2rem;font-weight:600;letter-spacing:-.02em;margin-bottom:2.5rem" data-t="landing_feature3_title"></h2>
      <div class="features">
        <div class="feature reveal" style="transition-delay:.05s"><div class="ico" data-icon="dna"></div><h3 style="font-size:1.05rem;font-weight:500;margin-bottom:.5rem" data-t="landing_feature1_title"></h3><p class="sm-t muted" data-t="landing_feature1_desc"></p></div>
        <div class="feature reveal" style="transition-delay:.13s"><div class="ico" data-icon="search"></div><h3 style="font-size:1.05rem;font-weight:500;margin-bottom:.5rem" data-t="landing_feature2_title"></h3><p class="sm-t muted" data-t="landing_feature2_desc"></p></div>
        <div class="feature reveal" style="transition-delay:.21s"><div class="ico" data-icon="boxes"></div><h3 style="font-size:1.05rem;font-weight:500;margin-bottom:.5rem" data-t="landing_feature3_title"></h3><p class="sm-t muted" data-t="landing_feature3_desc"></p></div>
      </div>
    </div>
  </section>

  <section class="section" style="background:color-mix(in srgb,var(--card) 40%,transparent)">
    <div class="inner">
      <h2 class="reveal" style="font-size:2rem;font-weight:600;letter-spacing:-.02em" data-t="landing_pipeline_title"></h2>
      <p class="muted reveal" style="transition-delay:.06s;margin:.75rem 0 2.5rem" data-t="landing_pipeline_desc"></p>
      <div class="stages" id="landingStages"></div>
      <p class="sm-t muted reveal" style="margin-top:1.5rem" data-t="pipeline_note"></p>
    </div>
  </section>

  <footer class="section">
    <div class="inner" style="display:flex;flex-direction:column;align-items:center;gap:1.5rem;text-align:center">
      <div class="logo"><span class="mark" data-icon="dna"></span><div class="name" data-t="brand"></div></div>
      <h2 style="font-size:1.6rem;font-weight:600;letter-spacing:-.02em">
        <span data-t="landing_hero_a"></span> <span data-t="landing_hero_b"></span> <span data-t="landing_hero_c"></span>
      </h2>
      <button class="btn lg" data-go="login"><span data-t="landing_cta"></span></button>
    </div>
  </footer>
</div>

<!-- ============================ LOGIN ============================ -->
<div id="screen-login" hidden style="min-height:100dvh;display:flex;flex-direction:column;position:relative">
  <div class="grid-bg" style="position:absolute;inset:0;opacity:.28;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse at top,black,transparent 70%);mask-image:radial-gradient(ellipse at top,black,transparent 70%)"></div>
  <div class="dna-field" id="loginDnaField"></div>
  <header style="position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:1.25rem 1.5rem">
    <a class="logo" data-go="landing" href="#"><span class="mark" data-icon="dna"></span><div class="name" data-t="brand"></div></a>
    <div class="row"><button class="btn outline sm js-lang"></button><button class="btn outline icon sm js-theme"></button></div>
  </header>
  <main style="position:relative;z-index:1;flex:1;display:grid;place-items:center;padding:2rem 1rem">
    <form id="loginForm" class="card fade" style="width:min(100%,26rem);padding:2rem">
      <h1 style="font-size:1.5rem;font-weight:600;letter-spacing:-.02em" data-t="login_title"></h1>
      <p class="sm-t muted" style="margin-top:.35rem" data-t="login_subtitle"></p>
      <div id="loginError" class="alert error" style="margin-top:1.25rem" hidden><span data-icon="alert"></span><span data-t="login_error"></span></div>
      <div class="stack" style="margin-top:1.5rem;gap:1rem">
        <div class="field"><label class="label" for="username" data-t="username"></label><input id="username" class="input" autocomplete="username"></div>
        <div class="field" style="position:relative"><label class="label" for="password" data-t="password"></label><input id="password" type="password" class="input" autocomplete="current-password" style="padding-inline-end:2.5rem"><button type="button" class="js-eye" data-target="password" style="position:absolute;inset-inline-end:.6rem;top:2.05rem;background:none;border:0;cursor:pointer;color:var(--muted-foreground)"></button></div>
        <a href="#" data-go="forgot" class="sm-t" style="text-align:end;color:var(--primary);text-decoration:none" data-t="forgot_link"></a>
        <button class="btn lg" style="width:100%" id="loginBtn" type="submit"><span data-t="login_button"></span></button>
      </div>
      <a href="#" data-go="signup" class="sm-t" style="display:block;text-align:center;margin-top:1.25rem;color:var(--primary);text-decoration:none" data-t="signup_link"></a>
    </form>
  </main>
</div>

<!-- ============================ SIGNUP ============================ -->
<div id="screen-signup" hidden style="min-height:100dvh;display:flex;flex-direction:column;position:relative">
  <div class="grid-bg" style="position:absolute;inset:0;opacity:.28;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse at top,black,transparent 70%);mask-image:radial-gradient(ellipse at top,black,transparent 70%)"></div>
  <header style="position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:1.25rem 1.5rem">
    <a class="logo" data-go="landing" href="#"><span class="mark" data-icon="dna"></span><div class="name" data-t="brand"></div></a>
    <div class="row"><button class="btn outline sm js-lang"></button><button class="btn outline icon sm js-theme"></button></div>
  </header>
  <main style="position:relative;z-index:1;flex:1;display:grid;place-items:center;padding:2rem 1rem">
    <form id="signupForm" class="card fade" style="width:min(100%,26rem);padding:2rem">
      <h1 style="font-size:1.5rem;font-weight:600;letter-spacing:-.02em" data-t="signup_title"></h1>
      <p class="sm-t muted" style="margin-top:.35rem" data-t="signup_subtitle"></p>
      <div id="signupError" class="alert error" style="margin-top:1.25rem" hidden><span data-icon="alert"></span><span id="signupErrorText"></span></div>
      <div class="stack" style="margin-top:1.5rem;gap:1rem">
        <div class="field"><label class="label" for="signupUsername" data-t="username"></label><input id="signupUsername" class="input" autocomplete="username"></div>
        <div class="field"><label class="label" for="signupEmail" data-t="signup_email_optional"></label><input id="signupEmail" type="email" class="input" autocomplete="email"></div>
        <div class="field" style="position:relative">
          <label class="label" for="signupPassword" data-t="password"></label>
          <input id="signupPassword" type="password" class="input" autocomplete="new-password" style="padding-inline-end:2.5rem">
          <button type="button" class="js-eye" data-target="signupPassword" style="position:absolute;inset-inline-end:.6rem;top:2.05rem;background:none;border:0;cursor:pointer;color:var(--muted-foreground)"></button>
          <div id="signupStrength" style="display:flex;gap:4px;margin-top:6px"><div></div><div></div><div></div></div>
          <p class="xs muted" style="margin-top:.35rem" data-t="reset_hint"></p>
        </div>
        <div class="field" style="position:relative">
          <label class="label" for="signupConfirm" data-t="reset_confirmpw_label"></label>
          <input id="signupConfirm" type="password" class="input" autocomplete="new-password" style="padding-inline-end:2.5rem">
          <button type="button" class="js-eye" data-target="signupConfirm" style="position:absolute;inset-inline-end:.6rem;top:2.05rem;background:none;border:0;cursor:pointer;color:var(--muted-foreground)"></button>
        </div>
        <button class="btn lg" style="width:100%" id="signupBtn" type="submit"><span data-t="signup_button"></span></button>
      </div>
      <a href="#" data-go="login" class="sm-t" style="display:block;text-align:center;margin-top:1.25rem;color:var(--primary);text-decoration:none" data-t="back_to_login"></a>
    </form>
  </main>
</div>

<!-- ============================ FORGOT PASSWORD ============================ -->
<div id="screen-forgot" hidden style="min-height:100dvh;display:flex;flex-direction:column;position:relative">
  <div class="grid-bg" style="position:absolute;inset:0;opacity:.28;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse at top,black,transparent 70%);mask-image:radial-gradient(ellipse at top,black,transparent 70%)"></div>
  <header style="position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:1.25rem 1.5rem">
    <a class="logo" data-go="landing" href="#"><span class="mark" data-icon="dna"></span><div class="name" data-t="brand"></div></a>
    <div class="row"><button class="btn outline sm js-lang"></button><button class="btn outline icon sm js-theme"></button></div>
  </header>
  <main style="position:relative;z-index:1;flex:1;display:grid;place-items:center;padding:2rem 1rem">
    <form id="forgotForm" class="card fade" style="width:min(100%,26rem);padding:2rem">
      <h1 style="font-size:1.5rem;font-weight:600;letter-spacing:-.02em" data-t="forgot_title"></h1>
      <p class="sm-t muted" style="margin-top:.35rem" data-t="forgot_subtitle"></p>
      <div id="forgotError" class="alert error" style="margin-top:1.25rem" hidden><span data-icon="alert"></span><span id="forgotErrorText"></span></div>
      <div class="stack" style="margin-top:1.5rem;gap:1rem">
        <div class="field"><label class="label" for="forgotEmail" data-t="email"></label><input id="forgotEmail" type="email" class="input" autocomplete="email"></div>
        <button class="btn lg" style="width:100%" id="forgotBtn" type="submit"><span data-t="forgot_button"></span></button>
      </div>
      <a href="#" data-go="login" class="sm-t" style="display:block;text-align:center;margin-top:1.25rem;color:var(--primary);text-decoration:none" data-t="back_to_login"></a>
    </form>
  </main>
</div>

<!-- ============================ RESET PASSWORD ============================ -->
<div id="screen-reset" hidden style="min-height:100dvh;display:flex;flex-direction:column;position:relative">
  <div class="grid-bg" style="position:absolute;inset:0;opacity:.28;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse at top,black,transparent 70%);mask-image:radial-gradient(ellipse at top,black,transparent 70%)"></div>
  <header style="position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:1.25rem 1.5rem">
    <a class="logo" data-go="landing" href="#"><span class="mark" data-icon="dna"></span><div class="name" data-t="brand"></div></a>
    <div class="row"><button class="btn outline sm js-lang"></button><button class="btn outline icon sm js-theme"></button></div>
  </header>
  <main style="position:relative;z-index:1;flex:1;display:grid;place-items:center;padding:2rem 1rem">
    <form id="resetForm" class="card fade" style="width:min(100%,26rem);padding:2rem">
      <h1 style="font-size:1.5rem;font-weight:600;letter-spacing:-.02em" data-t="reset_title"></h1>
      <p class="sm-t muted" style="margin-top:.35rem" data-t="reset_subtitle"></p>
      <div id="resetError" class="alert error" style="margin-top:1.25rem" hidden><span data-icon="alert"></span><span id="resetErrorText"></span></div>
      <div class="stack" style="margin-top:1.5rem;gap:1rem">
        <div class="field"><label class="label" for="resetEmail" data-t="email"></label><input id="resetEmail" type="email" class="input" autocomplete="email"></div>
        <div class="field">
          <label class="label" data-t="reset_code_label"></label>
          <div id="otpBoxes" dir="ltr" style="display:flex;gap:8px">
            <input maxlength="1" inputmode="numeric" class="input otp-box" style="width:2.4rem;text-align:center;padding:.6rem 0">
            <input maxlength="1" inputmode="numeric" class="input otp-box" style="width:2.4rem;text-align:center;padding:.6rem 0">
            <input maxlength="1" inputmode="numeric" class="input otp-box" style="width:2.4rem;text-align:center;padding:.6rem 0">
            <input maxlength="1" inputmode="numeric" class="input otp-box" style="width:2.4rem;text-align:center;padding:.6rem 0">
            <input maxlength="1" inputmode="numeric" class="input otp-box" style="width:2.4rem;text-align:center;padding:.6rem 0">
            <input maxlength="1" inputmode="numeric" class="input otp-box" style="width:2.4rem;text-align:center;padding:.6rem 0">
          </div>
        </div>
        <div class="field" style="position:relative">
          <label class="label" for="newPassword" data-t="reset_newpw_label"></label>
          <input id="newPassword" type="password" class="input" autocomplete="new-password" style="padding-inline-end:2.5rem">
          <button type="button" class="js-eye" data-target="newPassword" style="position:absolute;inset-inline-end:.6rem;top:2.05rem;background:none;border:0;cursor:pointer;color:var(--muted-foreground)"></button>
          <div class="pw-strength" id="pwStrength" style="display:flex;gap:4px;margin-top:6px"><div></div><div></div><div></div></div>
          <p class="xs muted" style="margin-top:.35rem" data-t="reset_hint"></p>
        </div>
        <div class="field" style="position:relative">
          <label class="label" for="confirmPassword" data-t="reset_confirmpw_label"></label>
          <input id="confirmPassword" type="password" class="input" autocomplete="new-password" style="padding-inline-end:2.5rem">
          <button type="button" class="js-eye" data-target="confirmPassword" style="position:absolute;inset-inline-end:.6rem;top:2.05rem;background:none;border:0;cursor:pointer;color:var(--muted-foreground)"></button>
        </div>
        <button class="btn lg" style="width:100%" id="resetBtn" type="submit"><span data-t="reset_button"></span></button>
      </div>
      <a href="#" data-go="login" class="sm-t" style="display:block;text-align:center;margin-top:1.25rem;color:var(--primary);text-decoration:none" data-t="back_to_login"></a>
    </form>
  </main>
</div>

<!-- ============================ APP SHELL ============================ -->
<div id="shell" hidden>
  <header id="topbar">
    <div class="topbar-row">
      <a class="logo" data-go="landing" href="#"><span class="mark" data-icon="dna"></span>
        <span class="name" data-t="brand"></span>
      </a>
      <div class="topbar-tools">
        <button class="btn outline sm js-lang"></button>
        <button class="btn outline icon sm js-theme"></button>
        <button class="btn ghost icon sm js-logout" title="Log out" data-icon="logout"></button>
      </div>
    </div>
    <nav id="topNav"></nav>
  </header>
  <main id="view"></main>
</div>

<!-- ============================ DIALOGS ============================ -->
<dialog id="patientDialog"><form method="dialog" class="dlg" id="patientForm">
  <h3 id="pdTitle"></h3>
  <p class="sm-t muted" style="margin-top:.25rem" data-t="patients_subtitle"></p>
  <div class="stack" style="margin-top:1.25rem;gap:1rem">
    <div class="field"><label class="label" for="pdName" data-t="patient_name"></label><input id="pdName" class="input" required></div>
    <div class="field"><label class="label" for="pdMrn" data-t="patient_mrn"></label><input id="pdMrn" class="input" required></div>
    <div class="cols2">
      <div class="field"><label class="label" for="pdGender" data-t="patient_gender"></label>
        <select id="pdGender" class="select">
          <option value="male" data-t="gender_male"></option>
          <option value="female" data-t="gender_female"></option>
          <option value="other" data-t="gender_other"></option>
        </select></div>
      <div class="field"><label class="label" for="pdDob" data-t="patient_dob"></label><input id="pdDob" type="date" class="input" required></div>
    </div>
  </div>
  <div class="foot">
    <button class="btn outline" type="button" value="cancel" data-close data-t="cancel"></button>
    <button class="btn" type="submit" id="pdSave" data-t="save"></button>
  </div>
</form></dialog>

<dialog id="confirmDialog"><div class="dlg">
  <h3 id="cfTitle"></h3>
  <p class="sm-t muted" style="margin-top:.5rem" id="cfDesc"></p>
  <div class="foot">
    <button class="btn outline" data-close data-t="cancel"></button>
    <button class="btn" id="cfOk" style="background:var(--destructive);color:var(--background)" data-t="delete"></button>
  </div>
</div></dialog>

<script src="js/chromogen/01-api-auth.js?v=1"></script>
<script src="js/chromogen/02-i18n-theme.js?v=1"></script>
<script src="js/chromogen/03-state-data.js?v=1"></script>
<script src="js/chromogen/04-ui-helpers.js?v=1"></script>
<script src="js/chromogen/05-scene-3d.js?v=1"></script>
<script src="js/chromogen/06-router.js?v=1"></script>
<script src="js/chromogen/07-views-core.js?v=1"></script>
<script src="js/chromogen/08-views-predict.js?v=1"></script>
<script src="js/chromogen/09-viewers.js?v=1"></script>
<script src="js/chromogen/10-wiring.js?v=1"></script>
</body>
</html>
