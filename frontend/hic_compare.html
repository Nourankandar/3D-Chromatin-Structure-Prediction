<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChromoGen · مقارنة الكروماتين</title>
<link rel="shortcut icon" href="/media/favicon.png?v=50" type="image/png">
<link rel="icon" href="/media/favicon.png?v=50" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Cairo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b221e; --scene:#081b18; --fg:#dfeee2; --muted:#7f9c8b;
    --primary:#8eb69b; --primary-deep:#43705d;
    --border:rgba(223,238,226,.10);
    --card:rgba(14,38,33,.72); --card-solid:#0e2621;
    --patient:#8eb69b; --control:#c8d3d6;
    --font-display:"Space Grotesk","Cairo",sans-serif;
    --font-sans:"Inter","Cairo",sans-serif;
    --font-mono:"JetBrains Mono",monospace;
    --r:14px;
  }
  :root[data-theme="light"]{
    --bg:#f3fcf6; --scene:#0a201d; --fg:#0c1f17; --muted:#4a645a;
    --primary:#214c3d; --primary-deep:#163529;
    --border:#cddcd2; --card:#f9fffb; --card-solid:#ffffff;
    --control:#5b6f74;
  }

  /* ── أزرق ── */
  :root[data-accent="blue"]{
    --bg:#171b26; --scene:#11141d; --fg:#e7e9ee; --muted:#819ada; --primary:#819ada; --primary-deep:#2c4a96;
    --border:rgba(63,67,78,.16); --card:rgba(23,27,38,.72); --card-solid:#262c3b;
  }
  :root[data-theme="light"][data-accent="blue"]{
    --bg:#f6f7f8; --scene:#11141d; --fg:#15171e; --muted:#495c8d; --primary:#2b4482; --primary-deep:#1f325f;
    --border:rgba(21,23,30,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── بنفسجي ── */
  :root[data-accent="purple"]{
    --bg:#1f1a24; --scene:#17131b; --fg:#ebe8ed; --muted:#b18dce; --primary:#b18dce; --primary-deep:#653a88;
    --border:rgba(71,66,76,.16); --card:rgba(31,26,36,.72); --card-solid:#312938;
  }
  :root[data-theme="light"][data-accent="purple"]{
    --bg:#f7f7f8; --scene:#17131b; --fg:#1a161d; --muted:#6e5582; --primary:#5a3875; --primary-deep:#422955;
    --border:rgba(26,22,29,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── ليلكي ── */
  :root[data-accent="lilac"]{
    --bg:#201c21; --scene:#181519; --fg:#ebeaec; --muted:#b79ac1; --primary:#b79ac1; --primary-deep:#6c4a78;
    --border:rgba(72,68,73,.16); --card:rgba(32,28,33,.72); --card-solid:#322d34;
  }
  :root[data-theme="light"][data-accent="lilac"]{
    --bg:#f7f7f8; --scene:#181519; --fg:#1a181b; --muted:#706176; --primary:#5f4667; --primary-deep:#45334b;
    --border:rgba(26,24,27,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── زهري ── */
  :root[data-accent="rose"]{
    --bg:#24191b; --scene:#1c1214; --fg:#ede8e9; --muted:#d18996; --primary:#d18996; --primary-deep:#8b3646;
    --border:rgba(76,65,67,.16); --card:rgba(36,25,27,.72); --card-solid:#39282b;
  }
  :root[data-theme="light"][data-accent="rose"]{
    --bg:#f8f7f7; --scene:#1c1214; --fg:#1d1617; --muted:#85525b; --primary:#793541; --primary-deep:#58272f;
    --border:rgba(29,22,23,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── خمري ── */
  :root[data-accent="wine"]{
    --bg:#281519; --scene:#1f0f12; --fg:#efe7e8; --muted:#e2788b; --primary:#e2788b; --primary-deep:#9f2239;
    --border:rgba(80,61,65,.16); --card:rgba(40,21,25,.72); --card-solid:#3e2328;
  }
  :root[data-theme="light"][data-accent="wine"]{
    --bg:#f8f6f7; --scene:#1f0f12; --fg:#1f1416; --muted:#944251; --primary:#8b2335; --primary-deep:#651a27;
    --border:rgba(31,20,22,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── ذهبي ── */
  :root[data-accent="gold"]{
    --bg:#282215; --scene:#1f190f; --fg:#efece7; --muted:#e2be78; --primary:#e2be78; --primary-deep:#9f7522;
    --border:rgba(80,74,61,.16); --card:rgba(40,34,21,.72); --card-solid:#3e3523;
  }
  :root[data-theme="light"][data-accent="gold"]{
    --bg:#f8f8f6; --scene:#1f190f; --fg:#1f1b14; --muted:#947842; --primary:#8b6723; --primary-deep:#654b1a;
    --border:rgba(31,27,20,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }

  /* ── رمادي ── */
  :root[data-accent="slate"]{
    --bg:#1c2021; --scene:#151819; --fg:#eaebec; --muted:#9ab5c1; --primary:#9ab5c1; --primary-deep:#4a6a78;
    --border:rgba(68,72,73,.16); --card:rgba(28,32,33,.72); --card-solid:#2d3234;
  }
  :root[data-theme="light"][data-accent="slate"]{
    --bg:#f7f7f8; --scene:#151819; --fg:#181a1b; --muted:#616f76; --primary:#465d67; --primary-deep:#33444b;
    --border:rgba(24,26,27,.12); --card:rgba(255,255,255,.82); --card-solid:#ffffff;
  }


  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg); font-family:var(--font-sans);
    overflow:hidden; height:100vh; display:flex; flex-direction:column; font-size:13.5px;
  }
  button{font:inherit; color:inherit; cursor:pointer}

  /*  الشريط العلوي */
  .topbar{
    display:flex; align-items:center; gap:14px; padding:10px 16px; flex:none;
    border-bottom:1px solid var(--border); background:var(--card-solid);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; }
  .brand .logo {
    width: 32px; 
    height: 32px; 
    border-radius: 9px; 
    background: var(--primary); 
    color: var(--card-solid); 
    display: flex; 
    align-items: center; 
    justify-content: center;
  }
  .brand .logo svg { width: 18px; height: 18px; }
  .brand .name { font-family: var(--font-display); font-weight: 700; font-size: .95rem; color: var(--fg); }
  .brand .name span { color: var(--primary); }
  .spacer{flex:1}

  .segmented{display:flex; background:transparent; border:1px solid var(--border); border-radius:11px; padding:3px; gap:2px}
  .seg-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; height:28px; padding:0 8px; border:0; border-radius:8px;
    background:transparent; color:var(--muted); font-size:12px; font-weight:500; transition:.16s; white-space:nowrap; flex:1;
  }
  .seg-btn svg{width:14px; height:14px}
  .seg-btn.on{background:color-mix(in srgb, var(--primary) 18%, transparent); color:var(--fg)}
  .seg-btn:not(.on):hover{color:var(--fg)}

  .ghost-btn{
    display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 13px; border-radius:10px;
    border:1px solid var(--border); background:transparent; color:var(--fg); font-size:12.5px; transition:.16s;
  }
  .ghost-btn:hover{border-color:color-mix(in srgb,var(--primary) 45%,transparent)}
  .ghost-btn.on{border-color:var(--primary); color:var(--primary)}
  .ghost-btn svg{width:15px; height:15px}

  .btn-primary{
    display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 15px; border:0; border-radius:10px;
    background:var(--primary); color:#07201b; font-size:12.5px; font-weight:600; transition:.16s;
  }
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-primary svg{width:15px; height:15px}
  #fi{display:none}

  .status{
    display:inline-flex; align-items:center; gap:8px; font-size:11.5px; color:var(--muted);
    font-family:var(--font-mono); max-width:240px;
  }
  .status .pulse{width:7px; height:7px; border-radius:50%; background:var(--primary); flex:none}
  .status.idle .pulse{background:var(--muted); opacity:.5}
  .status .txt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  /* ═══ جسم الصفحة ═══ */
  .body{flex:1; display:flex; min-height:0}
  .work{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0}

  .stage{flex:1; display:flex; gap:12px; padding:12px; min-height:0; position:relative;
    background-image:radial-gradient(color-mix(in srgb, var(--primary) 35%, transparent) 0.5px, transparent 0.5px);
    background-size:22px 22px;
  }
  .stage.single .pane.control{display:none}

 
  .icon-rail{
    flex:none; width:56px; display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:16px 0; background:var(--card-solid); border-inline-end:1px solid var(--border);
  }
  .icon-rail button{
    width:36px; height:36px; border:0; border-radius:11px; background:transparent; color:var(--muted);
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .icon-rail button:hover{background:color-mix(in srgb, var(--primary) 14%, transparent); color:var(--fg)}
  .icon-rail button.on{color:var(--primary); background:color-mix(in srgb, var(--primary) 16%, transparent)}
  .icon-rail button svg{width:18px; height:18px}
  .icon-rail .sep{width:24px; height:1px; background:var(--border); margin:2px 0}
  .pane{
    flex:1; position:relative; min-width:0; min-height:0; border-radius:18px; overflow:hidden;
    background:var(--scene); border:1px solid var(--border); display:flex; flex-direction:column;
    box-shadow:0 30px 60px -30px rgba(0,0,0,.6);
  }
  .pane iframe{flex:1; width:100%; height:100%; border:0; display:block; background:var(--scene)}
  .pane-label{
    position:absolute; top:12px; inset-inline-start:12px; z-index:3;
    display:inline-flex; align-items:center; gap:8px; height:28px; padding:0 12px; border-radius:999px;
    background:var(--card); backdrop-filter:blur(10px); border:1px solid var(--border);
  }
  .pane-label .dot{width:9px; height:9px; border-radius:50%; flex:none}
  .pane-label.patient .dot{background:var(--patient)}
  .pane-label.control .dot{background:var(--control)}
  .pane-label .ar{font-size:.76rem; font-weight:600}
  .pane-label .en{font-size:.58rem; letter-spacing:1.1px; color:var(--muted); font-family:var(--font-mono)}

  .empty{
    position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; text-align:center; background:var(--scene);
  }
  .empty.hidden{display:none}
  .empty .ic{opacity:.35}
  .empty .ic svg{width:26px; height:26px}
  .empty .t{font-family:var(--font-display); font-weight:600; font-size:.9rem}
  .empty .d{font-size:.76rem; color:var(--muted); max-width:220px; line-height:1.7}

  /* المسار الجينومي */
  .track{flex:none; margin:0 12px 12px; padding:12px 14px; border-radius:var(--r);
    background:var(--card-solid); border:1px solid var(--border)}
  .track.hidden{display:none}
  .track-head{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap}
  .track-title{font-family:var(--font-display); font-size:.76rem; font-weight:600}
  .mono-s{font-family:var(--font-mono); font-size:.64rem; color:var(--muted)}
  .chip{font-size:.64rem; padding:3px 9px; border-radius:999px; border:1px solid var(--border);
    background:transparent; color:var(--muted); white-space:nowrap; cursor:pointer}
  .chip:hover{color:var(--fg)}
  .chip.on{background:var(--fg); color:var(--card-solid); border-color:var(--fg)}

  .gb{display:grid; grid-template-columns:96px 1fr; align-items:stretch}
  .gb-lbl{display:flex; align-items:center; justify-content:flex-end; gap:5px;
    padding:0 8px; font-size:.58rem; color:var(--muted); font-family:var(--font-mono);
    border-inline-end:1px solid var(--border); border-bottom:1px solid var(--border);
    background:color-mix(in srgb, var(--fg) 2.5%, transparent); white-space:nowrap}
  .gb-lbl b{font-family:var(--font-display); font-size:.62rem; color:var(--fg); font-weight:600}
  .gb-row{position:relative; border-bottom:1px solid var(--border); overflow:hidden}
  .gb-grid{position:absolute; inset:0; pointer-events:none}
  .gb-grid i{position:absolute; top:0; bottom:0; width:1px;
    background:color-mix(in srgb, var(--fg) 9%, transparent)}

  /* المسطرة */
  .gb-rule{height:24px}
  .gb-rule .maj{position:absolute; bottom:0; width:1px; height:7px; background:var(--muted)}
  .gb-rule .min{position:absolute; bottom:0; width:1px; height:4px;
    background:color-mix(in srgb, var(--muted) 55%, transparent)}
  .gb-rule .lab{position:absolute; top:3px; transform:translateX(-50%); font-family:var(--font-mono);
    font-size:.55rem; color:var(--muted); white-space:nowrap}
  .gb-rule .lab.s{transform:none; inset-inline-start:3px}
  .gb-rule .lab.e{transform:none; inset-inline-end:3px}


  .gb-tad{height:16px; position:relative}
  .gb-tad .seg{position:absolute; top:0; bottom:0; border-inline-end:1px solid var(--card-solid);
    display:flex; align-items:center; justify-content:center; overflow:hidden}
  .gb-tad .seg span{font-family:var(--font-mono); font-size:.5rem; color:var(--card-solid);
    mix-blend-mode:luminosity; font-weight:700}
  .gb-tad .zoom-box{position:absolute; top:0; bottom:0; border-inline:1.5px solid var(--primary);
    background:color-mix(in srgb, var(--primary) 16%, transparent); pointer-events:none}

  /* طبقة الانفتاح/الانغلاق (نيوكليوزوم) */
  .gb-nuc{height:14px}

  /* مسارات البروتينات  */
  .gb-feat{height:34px; background:
    repeating-linear-gradient(0deg, transparent 0 16px, color-mix(in srgb,var(--fg) 3%, transparent) 16px 17px)}
  .gb-feat .axis{position:absolute; inset-inline:0; top:50%; height:1px;
    background:color-mix(in srgb, var(--fg) 12%, transparent)}
  .gene-bar{position:absolute; top:8px; height:calc(100% - 16px); min-width:6px; border-radius:5px;
    cursor:pointer; transition:.12s; opacity:.85}
  .gene-bar:hover, .gene-bar.on{opacity:1; outline:2px solid var(--fg); outline-offset:1px}
  .tick{position:absolute; width:9px; height:9px; border-radius:2px; cursor:pointer; transition:.12s;
    transform:translateX(-50%); border:1px solid color-mix(in srgb, #000 25%, transparent)}
  .tick:hover{outline:2px solid var(--primary); outline-offset:1px; z-index:3}
  .tick.on{outline:2px solid var(--fg); outline-offset:1px; z-index:4}
  .tick.absent{
    background:transparent!important;
    border:2px dashed currentColor; box-shadow:none;
  }
  .tick .stem{position:absolute; inset-inline-start:50%; width:1px; background:currentColor; opacity:.45}

  .track-legend{display:flex; gap:12px; flex-wrap:nowrap; overflow:hidden; padding:5px 10px;
    font-size:.57rem; color:var(--muted); font-family:var(--font-mono)}
  .lg-sw{display:inline-block; width:8px; height:8px; border-radius:2px; margin-inline-end:4px;
    vertical-align:-1px; border:1px solid color-mix(in srgb,#000 25%, transparent)}

  /* اللوحة الجانبية */
  .side{
    flex:none; width:300px; border-inline-start:1px solid var(--border); background:var(--card-solid);
    display:flex; flex-direction:column; min-height:0; transition:width .2s, opacity .2s;
  }
  .side.wide{width:min(600px, 46vw)}
  .side.closed{width:0; opacity:0; overflow:hidden; border:0}
  .tabs{display:flex; gap:2px; padding:10px 12px 0; flex:none}
  .tab{
    flex:1; height:30px; border:0; border-radius:8px; background:transparent; color:var(--muted);
    font-size:12px; font-weight:500; transition:.15s;
  }
  .tab.on{background:color-mix(in srgb, var(--primary) 16%, transparent); color:var(--fg)}
  .tabpane{display:none; flex:1; min-height:0; flex-direction:column; padding:12px}
  .tabpane.on{display:flex}

  .field{display:flex; flex-direction:column; gap:7px; padding:11px 0; border-bottom:1px solid var(--border)}
  .field:last-child{border-bottom:0}
  .field .lbl{font-size:.66rem; color:var(--muted); letter-spacing:.4px}
  .row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  input[type=range]{flex:1; accent-color:var(--primary)}
  .inp{
    height:30px; padding:0 10px; border-radius:9px; border:1px solid var(--border);
    background:transparent; color:var(--fg); font-size:12px; outline:none; width:100%;
  }
  .inp:focus{border-color:var(--primary)}

  .plist{flex:1; overflow:auto; margin-top:8px; display:flex; flex-direction:column; gap:2px}
  .plist::-webkit-scrollbar{width:5px}
  .plist::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px}
  .pitem{
    display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:9px; cursor:pointer;
    border:1px solid transparent; transition:.13s;
  }
  .pitem:hover{background:color-mix(in srgb, var(--fg) 5%, transparent)}
  .pitem.sel{border-color:var(--primary)}
  .pitem.off{opacity:.4}
  .pitem input{accent-color:var(--primary); width:14px; height:14px; flex:none; cursor:pointer}
  .pdot{width:8px; height:8px; border-radius:50%; flex:none}
  .pname{flex:1; font-size:12px; font-family:var(--font-mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ptag{font-size:.6rem; color:var(--muted); flex:none}

  table.pt{width:100%; border-collapse:collapse; font-size:11.5px}
  table.pt td:nth-child(n+3){white-space:nowrap}
  table.pt th{
    position:sticky; top:0; background:var(--card-solid); text-align:start; padding:7px 6px;
    font-weight:600; font-size:.63rem; color:var(--muted); cursor:pointer; border-bottom:1px solid var(--border);
  }
  table.pt td{padding:6px; border-bottom:1px solid var(--border)}
  table.pt tr.on td{background:color-mix(in srgb, var(--primary) 12%, transparent)}
  .mono{font-family:var(--font-mono)}
  .st-dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-inline-end:5px}
  .tbl-wrap{flex:1; overflow:auto; margin-top:8px}
  .tbl-wrap::-webkit-scrollbar{width:5px;height:5px}
  .tbl-wrap::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px}
  .hint{font-size:.62rem; color:var(--muted); line-height:1.7}  .helix-btn{
    flex:none; border:0; background:none; cursor:pointer; font-size:13px; line-height:1;
    padding:2px 4px; border-radius:6px; opacity:.85;
  }
  .helix-btn:hover{background:color-mix(in srgb, var(--primary) 16%, transparent); opacity:1}

  #helixOverlay{
    display:none; position:fixed; inset:0; background:rgba(4,16,14,.78); backdrop-filter:blur(3px);
    align-items:center; justify-content:center; z-index:300;
  }
  #helixCard{
    background:linear-gradient(180deg,var(--card),var(--bg)); border-radius:18px; width:94%; max-width:760px;
    max-height:88vh; overflow-y:auto; border:1px solid var(--border); box-shadow:0 30px 70px -20px rgba(0,0,0,.6);
  }
  .helix-head{display:flex; justify-content:space-between; align-items:flex-start; padding:18px 22px 14px; border-bottom:1px solid var(--border)}
  .helix-body{padding:16px 22px 22px}
  .helix-pair{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .helix-side{background:color-mix(in srgb, var(--scene) 55%, transparent); border-radius:12px; padding:10px}
  .helix-side p{text-align:center; font-size:11px; color:var(--muted); margin:0 0 4px}
  .helix-legend{display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-top:12px; justify-content:center}
  .helix-legend span{display:inline-flex; align-items:center; gap:5px}
  .helix-sw{width:9px; height:9px; border-radius:3px; display:inline-block}
</style>
<div id="helixOverlay" onclick="if(event.target===this) closeHelixModal()">
  <div id="helixCard">
    <div class="helix-head">
      <div>
        <p style="font-weight:600; font-size:15px; margin:0"> الحلزون الجزيئي الحقيقي</p>
        <p class="xs muted" id="helixSubtitle" style="margin:2px 0 0"></p>
      </div>
      <span onclick="closeHelixModal()" style="cursor:pointer; color:var(--muted); font-size:16px">✕</span>
    </div>
    <div class="helix-body">
      <div id="helixBodyContent"><p class="sm-t muted">جاري الجلب...</p></div>
    </div>
  </div>
</div>
</head>
<body>

<script>
(function(){
  try{
    var p = new URLSearchParams(location.search);
    var stored = localStorage.getItem('chromogen-theme');
    var wanted = p.get('theme') || stored || 'dark';
    if(wanted==='light') document.documentElement.setAttribute('data-theme','light');
  }catch(e){}
  window.addEventListener('storage', function(e){
    if(e.key!=='chromogen-theme') return;
    document.documentElement.setAttribute('data-theme', e.newValue==='light' ? 'light' : 'dark');
  });

  var ACCENTS={
    green :{primary:'#8eb69b',muted:'#8eb69b',scene:'#08201c',bg:'#0b2b26',card:'rgba(13,42,37,.66)'},
    blue  :{primary:'#8fa9d4',muted:'#8fa9d4',scene:'#0d1526',bg:'#111a2e',card:'rgba(20,30,54,.66)'},
    purple:{primary:'#b19cd0',muted:'#b19cd0',scene:'#1a1226',bg:'#20182e',card:'rgba(37,26,54,.66)'},
    lilac :{primary:'#b3a3c4',muted:'#b3a3c4',scene:'#1c1626',bg:'#231d2e',card:'rgba(42,34,54,.66)'},
    rose  :{primary:'#cf9d94',muted:'#cf9d94',scene:'#241413',bg:'#2e1b19',card:'rgba(54,30,28,.66)'},
    wine  :{primary:'#c48a92',muted:'#c48a92',scene:'#210f12',bg:'#2a1418',card:'rgba(54,20,24,.66)'},
    gold  :{primary:'#d0b878',muted:'#d0b878',scene:'#221a0d',bg:'#2b2211',card:'rgba(54,44,20,.66)'},
    slate :{primary:'#9fb0ba',muted:'#9fb0ba',scene:'#12181c',bg:'#171e22',card:'rgba(23,30,34,.66)'},
  };
  function applyAccent(a){
    var r=document.documentElement.style;
    if(a && ACCENTS[a] && a!=='green'){
      var c=ACCENTS[a];
      r.setProperty('--primary',c.primary); r.setProperty('--primary-deep',c.primary);
      r.setProperty('--muted',c.muted); r.setProperty('--scene',c.scene);
      r.setProperty('--bg',c.bg); r.setProperty('--card',c.card);
      r.setProperty('--card-solid',c.bg); 
    } else {
      ['--primary','--primary-deep','--muted','--scene','--bg','--card','--card-solid'].forEach(k=>r.removeProperty(k));
    }
  }
  try{ applyAccent(localStorage.getItem('chromogen-accent')); }catch(e){}
  window.addEventListener('storage', function(e){
    if(e.key==='chromogen-accent') applyAccent(e.newValue);
  });
})();


let theme = (()=>{ try{ return localStorage.getItem('chromogen-theme') || 'dark'; }catch(e){ return 'dark'; } })();
function applyTheme(){
  if(theme==='light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  const sun = document.getElementById('themeIconSun'), moon = document.getElementById('themeIconMoon');
  if(sun && moon){ sun.style.display = theme==='light'?'block':'none'; moon.style.display = theme==='light'?'none':'block'; }
  try{ localStorage.setItem('chromogen-theme', theme); }catch(e){}
  if(typeof renderProteinList === 'function') renderProteinList();
  if(typeof renderTrack === 'function' && document.getElementById('track') && !document.getElementById('track').classList.contains('hidden')) renderTrack();
}
applyTheme();   
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('btnTheme')?.addEventListener('click', ()=>{ theme = theme==='dark'?'light':'dark'; applyTheme(); });
  applyTheme();
});
window.addEventListener('storage', function(e){
  if(e.key==='chromogen-theme'){ theme = e.newValue==='light' ? 'light' : 'dark'; applyTheme(); }
});
</script>

<script>

window.CHROMO_API_BASE = 'http://127.0.0.1:8000/api';

const ctlState = {rot:true, proteins:true, lod:true};

function ctl(obj, btnId){
  frames().forEach(f=> tellFrame(f, {type:'chromo-ctl', ctl:obj}));
  if(btnId){ ['cSm','cRw'].forEach(id=> document.getElementById(id)?.classList.toggle('on', id===btnId)); }
}
function ctlToggle(key, btnId){
  ctlState[key] = !ctlState[key];
  document.getElementById(btnId)?.classList.toggle('on', ctlState[key]);
  ctl({[key]: ctlState[key]});
}
let nucColorOn=false;
function toggleNucColor(){
  nucColorOn = !nucColorOn;
  document.getElementById('floatNuc')?.classList.toggle('on', nucColorOn);
  ctl({clr: nucColorOn ? 'nucleosome' : 'emerald'});
}

let loadedData=null, currentMode='split', camSyncOn=true;


const STATUS = {
  frameshift: {label:'إزاحة إطار', color:'#e5766f', textLight:'#c2453c', rank:0},
  nonsense  : {label:'طفرة هراء',  color:'#f2905a', textLight:'#b85a1f', rank:1},
  missense  : {label:'طفرة خاطئة', color:'#e0b24d', textLight:'#93701a', rank:2},
  silent    : {label:'صامتة',      color:'#7aa2f7', textLight:'#3454a8', rank:3},
  none      : {label:'لا تغيير',   color:'#8eb69b', textLight:'#3d6e55', rank:4},
};

function statusTextColor(key){
  const isLight = document.documentElement.getAttribute('data-theme')==='light';
  return isLight ? (STATUS[key]?.textLight || STATUS[key]?.color) : STATUS[key]?.color;
}
let protFilter='all', sortKey='status', sortDir=1, selectedProt=null;
const hiddenProts = new Set();

let _genesCache = null;
async function loadGenes(outputId, token){
  if(_genesCache) return _genesCache;
  const base=(window.CHROMO_API_BASE||'/api').replace(/\/$/,'');
  const headers={'Accept':'application/json'}; if(token) headers['Authorization']='Bearer '+token;
  try{
    const listRes = await fetch(`${base}/genomics/output/${outputId}/genes/`, {headers});
    if(!listRes.ok){ _genesCache=[]; return _genesCache; }
    const list = await listRes.json();
    const details = await Promise.all((list||[]).map(async g=>{
      try{
        const r = await fetch(`${base}/genomics/output/${outputId}/genes/${encodeURIComponent(g.gene_id)}/`, {headers});
        return r.ok ? await r.json() : g;
      }catch(e){ return g; }
    }));
    _genesCache = details;
  }catch(e){ _genesCache = []; }
  return _genesCache;
}

function geneRows(){
  return (_genesCache||[]).map(g=>({
    key: g.gene_id,
    name: g.gene_name || g.gene_id,
    st: STATUS[g.mutation_type] ? g.mutation_type : 'none',
    start: g.gene_start ?? null,
    end: g.gene_end ?? null,
    isComplete: g.is_complete_in_patient_sample !== false,
    error: g.error || null,
    mutatedCodons: g.mutated_codons || [],
    raw: g,
  }));
}


function frames(){
  return [document.getElementById('framePatient'),
          document.getElementById('frameControl')].filter(Boolean);
}
function tellFrame(f, msg){ try{ f.contentWindow.postMessage(msg,'*'); }catch(e){} }

function pushSyncState(){
  const active = (currentMode==='stack') ? false : camSyncOn;
  frames().forEach((f,i)=> tellFrame(f, {type:'chromo-cam-init', sync:active, leader:i===0}));
  document.getElementById('floatSync')?.classList.toggle('on', camSyncOn);
}
function toggleSync(){ camSyncOn=!camSyncOn; pushSyncState(); }

window.addEventListener('message', ev=>{
  const d=ev.data; if(!d||!d.type) return;
  if(d.type!=='chromo-cam' && d.type!=='chromo-cam-claim') return;
  if(currentMode==='stack' || !camSyncOn) return;
  const fs=frames();
  const from=fs.find(f=>f.contentWindow===ev.source);
  if(!from) return;
  if(d.type==='chromo-cam-claim'){
    fs.forEach(f=>{ if(f!==from) tellFrame(f,{type:'chromo-cam-yield'}); });
    return;
  }
  fs.forEach(f=>{ if(f!==from) tellFrame(f,d); });
});


function pushVisibility(){
  frames().forEach(f=> tellFrame(f, {type:'chromo-protein-visibility', hidden:[...hiddenProts]}));
}
function toggleProtVisible(key, on){
  if(on) hiddenProts.delete(key); else hiddenProts.add(key);
  pushVisibility(); renderProteinList();
}
function setAllVisible(on){
  const rows = visibleRows();
  if(on) rows.forEach(r=> hiddenProts.delete(r.key));
  else   rows.forEach(r=> hiddenProts.add(r.key));
  pushVisibility(); renderProteinList();
}
function visibleRows(){
  const q=(document.getElementById('protSearch')?.value||'').trim().toLowerCase();
  return geneRows()
    .filter(r=> protFilter==='all' || r.st===protFilter)
    .filter(r=> !q || r.name.toLowerCase().includes(q) || r.key.toLowerCase().includes(q))
    .sort((a,b)=> STATUS[a.st].rank-STATUS[b.st].rank || a.name.localeCompare(b.name));
}


function escLocal(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function inferCodonType(c, geneType){
  if(geneType === 'frameshift') return 'frameshift';
  const ref = String(c.reference_amino_acid||'').toUpperCase();
  const pat = String(c.patient_amino_acid||'').toUpperCase();
  if(ref === pat) return 'silent';
  if(pat === '*' || pat === 'STOP' || pat === 'TER') return 'nonsense';
  return 'missense';
}

function renderCodonBreakdown(row){
  if(!row.mutatedCodons || row.mutatedCodons.length <= 1) return '';
  const lines = row.mutatedCodons.map(c=>{
    const t = inferCodonType(c, row.st);
    const col = STATUS[t]?.color || STATUS.none.color;
    const lbl = STATUS[t]?.label || '';
    return `<div class="codon-line" style="display:flex; align-items:center; gap:6px; padding:3px 0 3px 30px; font-size:10.5px">
      <span class="pdot" style="width:6px; height:6px; background:${col}"></span>
      <span class="mono" style="color:var(--muted)">#${escLocal(c.codon_number ?? '')}</span>
      <span class="mono" style="color:var(--fg)">${escLocal(c.reference_amino_acid||'?')}→${escLocal(c.patient_amino_acid||'?')}</span>
      <span style="color:${col}">${lbl}</span>
    </div>`;
  }).join('');
  return `<div class="codon-breakdown">${lines}</div>`;
}

function renderProteinList(){
  const box=document.getElementById('protList');
  const all=geneRows();
  const rows=visibleRows();
  document.getElementById('protCount').textContent =
    all.length ? `${all.length - hiddenProts.size}/${all.length} ظاهر` : '—';


  const present={}; all.forEach(r=>present[r.st]=(present[r.st]||0)+1);
  document.getElementById('protFilters').innerHTML =
    `<span class="chip ${protFilter==='all'?'on':''}" onclick="setFilter('all')">الكل ${all.length}</span>`+
    Object.keys(STATUS).filter(k=>present[k]).map(k=>
      `<span class="chip ${protFilter===k?'on':''}" onclick="setFilter('${k}')"
        style="${protFilter===k?'':'color:'+statusTextColor(k)}">${STATUS[k].label} ${present[k]}</span>`).join('');

  box.innerHTML='';
  if(!rows.length){
    box.innerHTML='<div class="hint" style="padding:14px 4px">لا جينات لعرضها ضمن هذه المنطقة.</div>';
    return;
  }
  rows.forEach(r=>{
    const on=!hiddenProts.has(r.key);
    const el=document.createElement('div');
    el.className='pitem'+(on?'':' off')+(selectedProt===r.key?' sel':'');
    el.innerHTML=
      `<input type="checkbox" ${on?'checked':''}>`+
      `<span class="pdot" style="background:${STATUS[r.st].color}"></span>`+
      `<span class="pname" title="${r.name}">${r.name}</span>`+
      `<span class="ptag">${STATUS[r.st].label}${r.mutatedCodons.length>1 ? ` (${r.mutatedCodons.length} طفرات)` : ''}</span>`+
      (selectedProt===r.key ? `<button class="helix-btn" title="عرض الحلزون الجزيئي الحقيقي" onclick="event.stopPropagation(); openHelixModal('${r.key}')"></button>` : '');
    el.querySelector('input').onclick=e=>{ e.stopPropagation(); toggleProtVisible(r.key, e.target.checked); };
    el.onclick=()=> openProteinCompare(r.name);
    box.appendChild(el);

    // تفصيل كل طفرة فردية بسطر لحالها تحت الجين — يظهر بس لو أكتر من طفرة وحدة
    if(r.mutatedCodons.length > 1){
      const detail = document.createElement('div');
      detail.innerHTML = renderCodonBreakdown(r);
      box.appendChild(detail.firstElementChild);
    }
  });
}

function openProteinCompare(geneName){
  if(window.parent && window.parent !== window){
    try{ window.parent.postMessage({type:'chromo-switch-tab', tab:'protein', gene:geneName}, '*'); return; }catch(e){}
  }
  const params = new URLSearchParams(location.search);
  const outputId = params.get('output_id') || params.get('output') || '';
  const token = params.get('token') || localStorage.getItem('chromogen-token') || '';
  const url = `protein_compare.html?output_id=${encodeURIComponent(outputId)}`
    + `&gene=${encodeURIComponent(geneName)}&protein=${encodeURIComponent(geneName)}`
    + (token ? `&token=${encodeURIComponent(token)}` : '');
  window.open(url, '_blank');
}


function renderNucRow(elId, track, regionStart, regionEnd){
  const el=document.getElementById(elId);
  if(!el) return;
  el.querySelectorAll('.gb-grid, .zoom-box').forEach(n=>n.remove());
  const span = regionEnd-regionStart;
  if(!track || !track.length || !(span>0)){
    el.style.background='transparent';
    el.title='لا توجد بيانات نيوكليوزوم لهذه الجهة';
    return;
  }
  const stops=[];
  track.forEach(u=>{
    const s=Math.max(0, Math.min(100, ((u.genomic_start-regionStart)/span)*100));
    const e=Math.max(0, Math.min(100, ((u.genomic_end-regionStart)/span)*100));
    if(e<=s) return;
    const color = u.state==='open' ? '#f2b84b' : '#3f5750';
    stops.push(`${color} ${s.toFixed(3)}% ${e.toFixed(3)}%`);
  });
  el.style.background = stops.length ? `linear-gradient(90deg, ${stops.join(', ')})` : 'transparent';
  const nOpen=track.filter(u=>u.state==='open').length;
  el.title = `${nOpen}/${track.length} وحدة مفتوحة (${Math.round(nOpen/track.length*100)}%) — كل وحدة ~200bp`;
}

/*  المسار الجينومي */
function renderTrack(){
  const rows=geneRows(), P=loadedData?.patient;
  if(!rows.length || !P) return;

  const visibleRows = rows.filter(r=>
    (protFilter==='all' || r.st===protFilter) && !hiddenProts.has(r.key) && r.start!=null && r.end!=null);

  let zStart=P.start, zEnd=P.end;
  if(visibleRows.length){
    const mn=Math.min(...visibleRows.map(r=>r.start)), mx=Math.max(...visibleRows.map(r=>r.end));
    const pad=Math.max((mx-mn)*0.15, 200);
    zStart=Math.max(P.start, mn-pad); zEnd=Math.min(P.end, mx+pad);
    if(zEnd<=zStart){ zStart=P.start; zEnd=P.end; }
  }
  const zoomed = zStart>P.start || zEnd<P.end;
  const span = zEnd-zStart;
  const pctZ = abs => Math.max(0, Math.min(100, ((abs-zStart)/span)*100));
  const fmt  = bp => bp>=1e6 ? (bp/1e6).toFixed(zoomed?3:2)+'M' : Math.round(bp/1e3)+'kb';

  document.getElementById('trackCoords').textContent =
    `${P.chrom}:${Math.round(zStart).toLocaleString()}-${Math.round(zEnd).toLocaleString()}`+
    (zoomed?`  (${fmt(span)} من أصل ${fmt(P.end-P.start)})`:`  (${fmt(span)})`);

  const rule=document.getElementById('gbRule');
  let rh='';
  for(let i=0;i<=20;i++){
    const pc=i*5;
    if(i%4===0){
      rh+=`<i class="maj" style="inset-inline-start:${pc}%"></i>`;
      const bp=zStart+span*(pc/100);
      const cls = i===0?'lab s' : i===20?'lab e' : 'lab';
      rh+=`<span class="${cls}" style="${i===0||i===20?'':'inset-inline-start:'+pc+'%'}">${(bp/1e6).toFixed(zoomed?3:2)}M</span>`;
    } else rh+=`<i class="min" style="inset-inline-start:${pc}%"></i>`;
  }
  rule.innerHTML=rh;

  const gridHTML='<div class="gb-grid">'+
    [20,40,60,80].map(pc=>`<i style="inset-inline-start:${pc}%"></i>`).join('')+'</div>';

  const strip=document.getElementById('tadStrip');
  strip.innerHTML='';
  const colors=P.tad_colors||['#8eb69b'];
  const tadBp = {};
  (P.coords_raw||[]).forEach(r=>{
    const m = /^(\d+)kb-(\d+)kb$/.exec(r.region||'');
    if(!m) return;
    const s = Number(m[1])*1000, e = Number(m[2])*1000, tid = r.tad_id||0;
    if(!tadBp[tid]) tadBp[tid] = {start:s, end:e, count:1};
    else { tadBp[tid].start = Math.min(tadBp[tid].start, s); tadBp[tid].end = Math.max(tadBp[tid].end, e); tadBp[tid].count++; }
  });
  const fullSpan = P.end-P.start;
  Object.keys(tadBp).map(Number).sort((a,b)=>tadBp[a].start-tadBp[b].start).forEach(tid=>{
    const b = tadBp[tid];
    const s = Math.max(0, Math.min(100, ((b.start-P.start)/fullSpan)*100));
    const e = Math.max(0, Math.min(100, ((b.end-P.start)/fullSpan)*100));
    const w = Math.max(e-s, 0.3);
    strip.insertAdjacentHTML('beforeend',
      `<div class="seg" title="TAD ${tid+1} — ${b.count} bin — ${Math.round(b.start).toLocaleString()}-${Math.round(b.end).toLocaleString()}bp"
        style="inset-inline-start:${s.toFixed(3)}%; width:${w.toFixed(3)}%; background:${colors[tid]||'#8eb69b'}">
        <span>${tid+1}</span></div>`);
  });
  const tadRow=document.getElementById('gbTadRow');
  tadRow.querySelector('.zoom-box')?.remove();
  if(zoomed){
    const l=((zStart-P.start)/(P.end-P.start))*100, w=((zEnd-zStart)/(P.end-P.start))*100;
    tadRow.insertAdjacentHTML('beforeend',
      `<div class="zoom-box" style="inset-inline-start:${l.toFixed(2)}%; width:${Math.max(w,0.6).toFixed(2)}%"></div>`);
  }

  /*  طبقة الانفتاح/الانغلاق (نيوكليوزوم) — لكل جهة على حدة */
  renderNucRow('nucPatientRow', P.nucleosome_track, P.start, P.end);
  renderNucRow('nucControlRow', loadedData?.control?.nucleosome_track, P.start, P.end);

  /*  الفلاتر  */
  const fl=document.getElementById('trackFilters');
  const present={}; rows.forEach(r=>present[r.st]=(present[r.st]||0)+1);
  fl.innerHTML=`<span class="chip ${protFilter==='all'?'on':''}" onclick="setFilter('all')">الكل ${rows.length}</span>`+
    Object.keys(STATUS).filter(k=>present[k]).map(k=>
      `<span class="chip ${protFilter===k?'on':''}" onclick="setFilter('${k}')"
        style="${protFilter===k?'':'color:'+statusTextColor(k)}">${STATUS[k].label} ${present[k]}</span>`).join('');

  const lp=document.getElementById('lanePatient'), lc=document.getElementById('laneControl');
  lp.innerHTML=gridHTML+'<div class="axis"></div>';
  lc.innerHTML=gridHTML+'<div class="axis"></div>';
  visibleRows.forEach(r=>{
    const col=STATUS[r.st].color;
    const s=Math.max(zStart, r.start), e=Math.min(zEnd, r.end);
    const left=pctZ(s), width=Math.max(pctZ(e)-pctZ(s), 0.6);
    [lp, lc].forEach(lane=>{
      const el=document.createElement('div');
      el.className='gene-bar'+(selectedProt===r.key?' on':'');
      el.style.insetInlineStart=left.toFixed(2)+'%';
      el.style.width=width.toFixed(2)+'%';
      el.style.background=col;
      el.title=`${r.name} · ${STATUS[r.st].label}${r.mutatedCodons.length>1 ? ` (${r.mutatedCodons.length} طفرات)` : ''}\n${P.chrom}:${Math.round(r.start).toLocaleString()}-${Math.round(r.end).toLocaleString()}`+
        (r.isComplete===false ? '\n⚠ الجين غير مغطّى بالكامل ضمن منطقة التحليل' : '');
      el.onclick=()=>highlightGeneOnScenes(r);
      lane.appendChild(el);
    });
  });

  const nucLegend = (P.nucleosome_track?.length || loadedData?.control?.nucleosome_track?.length)
    ? `<span><span class="lg-sw" style="background:#f2b84b"></span>مفتوح</span>`+
      `<span><span class="lg-sw" style="background:#3f5750"></span>ملفوف</span>`
    : '';
  document.getElementById('trackLegend').innerHTML = nucLegend +
    Object.keys(STATUS).filter(k=>present[k]).map(k=>
      `<span><span class="lg-sw" style="background:${STATUS[k].color}"></span>${STATUS[k].label}</span>`).join('');
}

function setFilter(f){
  protFilter=f; renderTrack(); renderProteinList();
  frames().forEach(fr=> tellFrame(fr,{type:'chromo-protein-filter', filter:f}));
}

function pointsAtMutationSites(regionPoints, mutatedCodons){
  // 1. إذا لم تتوفر نقاط المنطقة بالجين، نأخذ كافة نقاط الكروماتين المريض المجلوبة
  const allPoints = (regionPoints && regionPoints.length) 
                    ? regionPoints 
                    : (loadedData?.patient?.coords_raw || []);
                    
  if(!allPoints.length || !mutatedCodons?.length) return allPoints;

  // 2. استخراج موقع الطفرة الجينومي من الكودونات المتطفرة
  const positions = mutatedCodons.map(c => c.genomic_position).filter(p => p != null);
  if(!positions.length) return allPoints;

  // 3. المطابقة مع مناطق الكروماتين
  const hit = allPoints.filter(p => {
    if(!p.region) return false;
    const matches = p.region.match(/(\d+)(kb)?\s*-\s*(\d+)(kb)?/i);
    if(!matches) return false;
    
    let start = Number(matches[1]);
    let end = Number(matches[3]);
    
    if(matches[2]?.toLowerCase() === 'kb') start *= 1000;
    if(matches[4]?.toLowerCase() === 'kb') end *= 1000;
    
    return positions.some(pos => pos >= start && pos < end);
  });

  return hit.length ? hit : allPoints;
}


function highlightGeneOnScenes(row){
  const same = selectedProt===row.key;
  selectedProt = same ? null : row.key;
  renderTrack();
  const color = STATUS[row.st]?.color;
  const fP=document.getElementById('framePatient'), fC=document.getElementById('frameControl');
  const pPoints = same ? [] : pointsAtMutationSites(row.raw?.patient_3d_region, row.mutatedCodons);
  const cPoints = same ? [] : pointsAtMutationSites(row.raw?.control_3d_region, row.mutatedCodons);
  if(fP) tellFrame(fP, {type:'chromo-highlight-region', points: pPoints, color});
  if(fC) tellFrame(fC, {type:'chromo-highlight-region', points: cPoints, color});
}

function selectProt(key, targetSide){
  selectedProt = (selectedProt===key) ? null : key;
  renderTrack(); renderProteinList();
  const msg = {type:'chromo-protein-focus', protein:selectedProt};
  if(targetSide && selectedProt){
    const f = document.getElementById(targetSide==='patient' ? 'framePatient' : 'frameControl');
    if(f) tellFrame(f, msg);
  } else {
    frames().forEach(fr=> tellFrame(fr, msg));
  }
}

/*  واجهة */
function setTab(t){
  const map={prot:['tabProt','paneProt']};
  Object.entries(map).forEach(([k,[tab,pane]])=>{
    document.getElementById(tab)?.classList.toggle('on', k===t);
    document.getElementById(pane)?.classList.toggle('on', k===t);
  });
  if(t==='prot')  renderProteinList();
}
function togglePanel(){
  const s=document.getElementById('side');
  s.classList.toggle('closed');
  document.getElementById('btnPanel').classList.toggle('on', !s.classList.contains('closed'));
}
function toggleTrack(){
  const t=document.getElementById('track');
  t.classList.toggle('hidden');
  const open=!t.classList.contains('hidden');
  document.getElementById('btnTrack')?.classList.toggle('on', open);
  document.getElementById('btnTrackHeader')?.classList.toggle('on', open);
  if(open) renderTrack();
}

function toggleProteinPanel(){
  const s=document.getElementById('side');
  const btn=document.getElementById('btnProtPanel');
  const alreadyOpenOnProt = !s.classList.contains('closed') && document.getElementById('tabProt').classList.contains('on');
  if(alreadyOpenOnProt){
    s.classList.add('closed');
    document.getElementById('btnPanel').classList.remove('on');
  } else {
    s.classList.remove('closed');
    document.getElementById('btnPanel').classList.add('on');
    setTab('prot');
  }
  btn.classList.toggle('on', !alreadyOpenOnProt);
}

function setStatus(text, live){
  document.getElementById('statusTxt').textContent=text;
  document.getElementById('statusPill').classList.toggle('idle', !live);
}
function hideEmpty(which){
  document.getElementById(which==='patient'?'emptyPatient':'emptyControl')?.classList.add('hidden');
}

function setMode(mode){
  currentMode=mode;
  const stage=document.getElementById('stage');
  document.getElementById('modeSplit').classList.toggle('on', mode==='split');
  document.getElementById('modeStack').classList.toggle('on', mode==='stack');
  if(mode==='stack'){ stage.classList.add('single'); reloadFrames('both'); }
  else { stage.classList.remove('single'); reloadFrames('split'); }
  pushSyncState();
}

function reloadFrames(mode){
  if(!loadedData) return;
  const send=(frame, payloadData, side, which)=>{
    const post=()=>{ try{
      frame.contentWindow.postMessage({type:'chromo-load', payload: payloadData, side: side}, '*');
      if(which) hideEmpty(which);
      pushVisibility();
    }catch(e){} };
    if(frame.dataset.ready==='1') post();
    else frame.onload=()=>{ frame.dataset.ready='1'; post(); };
    setTimeout(post, 300);
    setTimeout(pushSyncState, 350);
    setTimeout(()=> tellFrame(frame, {type:'chromo-ctl', ctl:{clr: nucColorOn?'nucleosome':'emerald'}}), 500);
  };

  if(mode==='both'){
    send(document.getElementById('framePatient'), loadedData, 'both', 'patient');
  } else {
    send(document.getElementById('framePatient'), loadedData.patient || loadedData, 'patient', 'patient');
    send(document.getElementById('frameControl'), loadedData.control || loadedData, 'control', 'control');
  }
}


function afterData(){
  renderProteinList();
  if(!document.getElementById('track').classList.contains('hidden')) renderTrack();
}

function loadFile(input){
  const file=input.files[0]; if(!file) return;
  setStatus('جاري المعالجة…', true);
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      loadedData=(parsed.patient||parsed.control)?parsed:{patient:parsed};
      afterData();
      reloadFrames(currentMode==='stack'?'both':'split');
      setStatus(file.name, true);
    }catch(err){ alert('خطأ في الملف: '+err.message); setStatus('فشل التحميل', false); }
  };
  reader.readAsText(file,'utf-8');
}

async function bootFromAPI(){
  const params=new URLSearchParams(location.search);
  const outputId=(params.get('output_id')||params.get('output')||'').trim();
  if(!outputId) return;
  setStatus('جاري الجلب… #'+outputId, true);
  try{
    const base=(window.CHROMO_API_BASE||'/api').replace(/\/$/,'');
    const path=(window.CHROMO_VIZ_PATH||(id=>`/genomics/output/${id}/full/`))(outputId);
    const token=params.get('token')||localStorage.getItem('chromogen-token')||'';
    const headers={'Accept':'application/json'}; if(token) headers['Authorization']='Bearer '+token;
    const res=await fetch(base+path,{headers});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const payload=await res.json();
    loadedData=(payload.patient||payload.control)?payload:{patient:payload};
    afterData();
    reloadFrames('split');
    setStatus('output #'+outputId, true);

    nucColorOn = true;
    document.getElementById('floatNuc')?.classList.add('on');

    loadGenes(outputId, token).then(()=>{ renderProteinList(); renderTrack(); });
  }catch(err){ console.error('[compare] API load failed:', err); setStatus('تعذّر الجلب — استورد ملف', false); }
}


let _inputDetailCache = null;
let _fastaCache = {}; 

const BASE_COLOR = {A:'#6fd3c0', T:'#e5766f', C:'#7aa2f7', G:'#e0b24d'};
function complementBase(b){ return {A:'T',T:'A',C:'G',G:'C'}[b] || b; }

async function getInputDetail(){
  if(_inputDetailCache) return _inputDetailCache;
  const params = new URLSearchParams(location.search);
  const inputId = params.get('input_id');
  if(!inputId) throw new Error('لا يوجد input_id بالرابط');
  const base=(window.CHROMO_API_BASE||'/api').replace(/\/$/,'');
  const token=params.get('token')||localStorage.getItem('chromogen-token')||'';
  const headers={'Accept':'application/json'}; if(token) headers['Authorization']='Bearer '+token;
  const res = await fetch(base+`/genomics/${inputId}/`, {headers});
  if(!res.ok) throw new Error('HTTP '+res.status);
  _inputDetailCache = await res.json();
  return _inputDetailCache;
}

async function fetchFastaSeq(url){
  if(!url) return null;
  if(_fastaCache[url]) return _fastaCache[url];
  const res = await fetch(url);
  if(!res.ok) throw new Error('تعذّر جلب ملف الفاستا');
  const raw = await res.text();
  const seq = raw.split('\n').filter(l=>!l.startsWith('>')).join('').replace(/[^ACGTacgt]/g,'').toUpperCase();
  _fastaCache[url] = seq;
  return seq;
}

function windowAround(seq, positionIndex, span){
  if(!seq) return '';
  const half = Math.floor(span/2);
  let start = Math.max(0, (positionIndex||0) - half);
  let end = Math.min(seq.length, start + span);
  start = Math.max(0, end - span);
  return seq.slice(start, end);
}

function buildHelixSVG(seq, diffMask, width=220, height=380){
  const RISE=16, RADIUS=34, TWIST=36, PHASE=144; 
  const cx = width/2, topPad = 20;
  const n = seq.length;
  const pts1=[], pts2=[];
  for(let i=0;i<n;i++){
    const a1 = (i*TWIST) * Math.PI/180;
    const a2 = a1 + PHASE*Math.PI/180;
    const y = topPad + i*RISE;
    pts1.push({x:cx+RADIUS*Math.cos(a1), y, depth:Math.sin(a1), base:seq[i]});
    pts2.push({x:cx+RADIUS*Math.cos(a2), y, depth:Math.sin(a2), base:complementBase(seq[i])});
  }
  const rungs = pts1.map((p,i)=>({i, depth:(p.depth+pts2[i].depth)/2}));
  rungs.sort((a,b)=>a.depth-b.depth);

  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" style="display:block">`;
  const path1 = pts1.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const path2 = pts2.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  svg += `<polyline points="${path1}" fill="none" stroke="var(--muted)" stroke-width="2.5" opacity=".55"/>`;
  svg += `<polyline points="${path2}" fill="none" stroke="var(--muted)" stroke-width="2.5" opacity=".55"/>`;

  rungs.forEach(({i})=>{
    const p1=pts1[i], p2=pts2[i];
    const scale = 0.65 + 0.35*((p1.depth+1)/2); 
    const isDiff = diffMask && diffMask[i];
    const c1 = BASE_COLOR[p1.base]||'#888', c2 = BASE_COLOR[p2.base]||'#888';
    svg += `<line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}"
      stroke="${isDiff?'var(--fg)':'var(--border)'}" stroke-width="${isDiff?2.5:1.4}" opacity="${0.4+0.5*scale}"/>`;
    [ [p1,c1], [p2,c2] ].forEach(([p,c])=>{
      svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(4*scale).toFixed(1)}" fill="${c}"
        ${isDiff?`stroke="var(--fg)" stroke-width="1.5"`:''}/>`;
    });
    if(isDiff){
      svg += `<circle cx="${((p1.x+p2.x)/2).toFixed(1)}" cy="${p1.y.toFixed(1)}" r="${(RADIUS+8)}" fill="none"
        stroke="var(--fg)" stroke-width="1" stroke-dasharray="2,3" opacity=".5"/>`;
    }
  });
  svg += `</svg>`;
  return svg;
}

function closeHelixModal(){ document.getElementById('helixOverlay').style.display='none'; }

async function openHelixModal(protKey){
  const overlay = document.getElementById('helixOverlay');
  const body = document.getElementById('helixBodyContent');
  const sub = document.getElementById('helixSubtitle');
  overlay.style.display='flex';
  body.innerHTML = `<p class="sm-t muted">جاري الجلب...</p>`;
  sub.textContent = '';

  const row = geneRows().find(r=>r.key===protKey);
  if(!row){ body.innerHTML = `<p class="sm-t" style="color:var(--destructive,#e5766f)">تعذّر إيجاد بيانات هذا البروتين.</p>`; return; }

  try{
    const detail = await getInputDetail();
    const patientUrl = detail.dna_sequence_file, controlUrl = detail.dna_control_file;
    if(!patientUrl || !controlUrl){
      body.innerHTML = `<p class="sm-t" style="color:var(--destructive,#e5766f)">لا توجد ملفات فاستا مرتبطة بهذا التحليل.</p>`;
      return;
    }
    const [pSeq, cSeq] = await Promise.all([fetchFastaSeq(patientUrl), fetchFastaSeq(controlUrl)]);
    const anchorAbs = row.mutatedCodons?.[0]?.genomic_position ?? row.start;
    const rel = (loadedData?.patient?.start!=null && anchorAbs!=null) ? (anchorAbs - loadedData.patient.start) : null;
    if(rel==null){
      body.innerHTML = `<p class="sm-t" style="color:var(--destructive,#e5766f)">لا يوجد موقع جينومي حقيقي لهذا الجين.</p>`;
      return;
    }

    const SPAN = 32;
    const pWin = windowAround(pSeq, rel, SPAN);
    const cWin = windowAround(cSeq, rel, SPAN);

    const len = Math.min(pWin.length, cWin.length);
    const diffMask = new Array(len).fill(false);
    let diffCount = 0;
    for(let i=0;i<len;i++){ if(pWin[i]!==cWin[i]){ diffMask[i]=true; diffCount++; } }

    sub.textContent = `${row.name} · ${len} قاعدة حول الموقع الحقيقي · ${diffCount} فرق فعلي بين الجهتين`;
    body.innerHTML = `
      <div class="helix-pair">
        <div class="helix-side"><p>السليم (control)</p>${buildHelixSVG(cWin, diffMask)}</div>
        <div class="helix-side"><p>المريض (patient)</p>${buildHelixSVG(pWin, diffMask)}</div>
      </div>
      <div class="helix-legend">
        <span><span class="helix-sw" style="background:${BASE_COLOR.A}"></span>A</span>
        <span><span class="helix-sw" style="background:${BASE_COLOR.T}"></span>T</span>
        <span><span class="helix-sw" style="background:${BASE_COLOR.C}"></span>C</span>
        <span><span class="helix-sw" style="background:${BASE_COLOR.G}"></span>G</span>
        <span style="opacity:.8">○ إطار متقطّع = قاعدة مختلفة فعلياً بين الجهتين</span>
      </div>
      <p class="xs muted" style="text-align:center; margin-top:10px">
        كل قاعدة هون من ملف الفاستا الحقيقي تبع هذا التحليل. الشريط التكميلي مُشتق بقاعدة
        واطسون-كريك الحتمية (A↔T, C↔G) — الأبعاد نسبية (3.4Å لكل قاعدة، 36° التفاف)
        وليست بمقياس حقيقي دقيق.
      </p>`;
  }catch(err){
    console.error('[helix] failed:', err);
    body.innerHTML = `<p class="sm-t" style="color:var(--destructive,#e5766f)">تعذّر بناء العرض الجزيئي: ${err.message||err}</p>`;
  }
}

window.addEventListener('load', ()=>{
  bootFromAPI();
  setTimeout(()=>{ pushSyncState(); ctl({repr:'atoms'}); }, 600);
});
